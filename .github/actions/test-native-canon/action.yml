name: Test native typechecker product laws
description: Require native snapshot ownership, projection ranges and syntax/semantic completion
runs:
  using: composite
  steps:
    - name: Verify checked source and package consumer census
      shell: bash
      env:
        CARGO_TARGET_DIR: ${{ github.workspace }}/target
      run: |
        set -euo pipefail
        node tools/support/compat/github/checked-corsa-source.ts
        node --test tools/support/compat/github/checked-corsa-*.test.ts
        cargo fetch --locked
    - name: Compare original copying and borrowed preclose allocation with whole custody
      shell: bash
      run: |
        set -euo pipefail
        output="$RUNNER_TEMP/native-preclose-allocation"
        mkdir -p "$output"
        original=406a0c412eda661aabadf954e5cf02df58db22e9
        actor_head="$(git rev-parse HEAD)"
        paths=(vendor/corsa_core/src/process/guard.rs vendor/corsa_core/src/process/lifetime.rs vendor/corsa_core/src/process_receipt.rs)
        git diff --exit-code
        git fetch --no-tags --depth=1 origin "$original"
        test "$(git rev-parse "$original^{commit}")" = "$original"
        restore_source() {
          for path in "${paths[@]}"; do git show "$actor_head:$path" > "$path"; done
        }
        trap restore_source EXIT
        for path in "${paths[@]}"; do git show "$original:$path" > "$path"; done
        ORIGINAL_SOURCE="$original" ACTOR_HEAD="$actor_head" OUTPUT="$output" node --input-type=module <<'JS'
        import assert from 'node:assert/strict';
        import { execFileSync } from 'node:child_process';
        import { createHash } from 'node:crypto';
        import { readFileSync, writeFileSync } from 'node:fs';
        const paths = ['vendor/corsa_core/src/process/guard.rs', 'vendor/corsa_core/src/process/lifetime.rs', 'vendor/corsa_core/src/process_receipt.rs'];
        const git = (...args) => execFileSync('git', args);
        const sha = bytes => createHash('sha256').update(bytes).digest('hex');
        assert.deepEqual(git('diff', '--name-only').toString().trim().split('\n').sort(), [...paths].sort());
        const files = paths.map(path => {
          const bytes = readFileSync(path);
          assert.deepEqual(bytes, git('show', process.env.ORIGINAL_SOURCE + ':' + path));
          return { path, sha256: sha(bytes) };
        });
        const actor = 'crates/vize_canon/tests/corsa_process_allocation.rs';
        const manifest = 'crates/vize_canon/Cargo.toml';
        for (const path of [actor, manifest]) assert.deepEqual(readFileSync(path), git('show', process.env.ACTOR_HEAD + ':' + path));
        writeFileSync(process.env.OUTPUT + '/counterpart-source.json', JSON.stringify({ originalThreeBodies: process.env.ORIGINAL_SOURCE, actorHead: process.env.ACTOR_HEAD, currentCensusValidated: false, custody: 'Only these three immutable original Git bodies replace current source during copying; current census was validated before overlay and will be revalidated after restoration.', files, actorSha256: sha(readFileSync(actor)), manifestSha256: sha(readFileSync(manifest)) }, null, 2) + '\n');
        JS
        VIZE_CORSA_ALLOCATION_ARM=copying cargo test --locked --profile ci -p vize_canon --test corsa_process_allocation -- --exact borrowed_preclose_preserves_full_custody_without_discarded_copy_allocations --nocapture 2>&1 | tee "$output/copying.log"
        grep -Fx 'borrowed_preclose_preserves_full_custody_without_discarded_copy_allocations: PASS (copying)' "$output/copying.log"
        restore_source
        trap - EXIT
        git diff --exit-code
        node tools/support/compat/github/checked-corsa-source.ts
        VIZE_CORSA_ALLOCATION_ARM=borrowed cargo test --locked --profile ci -p vize_canon --test corsa_process_allocation -- --exact borrowed_preclose_preserves_full_custody_without_discarded_copy_allocations --nocapture 2>&1 | tee "$output/borrowed.log"
        grep -Fx 'borrowed_preclose_preserves_full_custody_without_discarded_copy_allocations: PASS (borrowed)' "$output/borrowed.log"
        for case in process::guard::tests::borrowed_precheck_keeps_first_fault_before_alive_or_consumed_child process::lifetime::preclose_tests::borrowed_metadata_access_keeps_exact_copying_refusal_order process_receipt::tests::borrowed_receipt_access_preserves_all_ordered_busy_and_poison_refusals; do
          cargo test --locked --profile ci -p vize_corsa_core --lib "$case" -- --exact --nocapture --test-threads=1 2>&1 | tee -a "$output/lock-order.log"
        done
        test "$(grep -cF 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$output/lock-order.log")" = 3
    - name: Test poisoned actual owned process lock and exact reaping
      shell: bash
      env:
        VIZE_SNAPSHOT_SOURCE_CAPTURE_DIR: ${{ runner.temp }}/native-snapshot-source
      run: |
        set -euo pipefail
        cargo test --locked --profile ci -p vize_corsa_core --lib process::guard::tests::poisoned_owned_process_lock_still_kills_waits_and_reaps_with_explicit_poison_error -- --exact --nocapture --test-threads=1 | tee "$RUNNER_TEMP/native-owned-process-poison-test.log"
        grep -F "test result: ok. 1 passed" "$RUNNER_TEMP/native-owned-process-poison-test.log"
    - name: Test actual native preclose epochs and strict failed-close retries
      shell: bash
      env:
        VIZE_TEST_REQUIRE_TSGO: "1"
        VIZE_SNAPSHOT_SOURCE_CAPTURE_DIR: ${{ runner.temp }}/native-snapshot-source
      run: |
        set -euo pipefail
        unset VIZE_TEST_DISABLE_TSGO
        cargo test --locked --profile ci -p vize_canon --lib corsa_bridge::bridge::shutdown::tests::native_preclose_unused_foreign_keeps_failed_evidence_and_live_owner_clean -- --ignored --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/native-preclose-epochs-test.log"
        cargo test --locked --profile ci -p vize_canon --lib corsa_bridge::bridge::shutdown::tests::native_preclose_alive_then_killed_stays_strict_across_failed_close_retry -- --ignored --exact --nocapture --test-threads=1 2>&1 | tee -a "$RUNNER_TEMP/native-preclose-epochs-test.log"
        test "$(grep -cF 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/native-preclose-epochs-test.log")" = 2
    - name: Test complete native snapshot text and owner refusals
      shell: bash
      env:
        VIZE_TEST_REQUIRE_TSGO: "1"
        VIZE_SNAPSHOT_SOURCE_CAPTURE_DIR: ${{ runner.temp }}/native-snapshot-source
      run: |
        unset VIZE_TEST_DISABLE_TSGO
        cargo test --locked --profile ci -p vize_canon --lib lsp_client::editor_lsp::snapshot_source::tests::native::actual_native_snapshot_retains_complete_stdlib_and_overlay_text_with_owner_refusals -- --ignored --exact --nocapture
    - name: Test admitted actual spawn failure and sealed custody handoff
      shell: bash
      env:
        VIZE_SNAPSHOT_SOURCE_CAPTURE_DIR: ${{ runner.temp }}/native-snapshot-source
      run: |
        set -euo pipefail
        cargo test --locked --profile ci -p vize_canon --lib lsp_client::startup_control::tests::setup_drop -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/native-setup-drop-test.log"
        grep -F "test result: ok. 2 passed" "$RUNNER_TEMP/native-setup-drop-test.log"
    - name: Test ordinary recovery custody publication with and without logging
      shell: bash
      env:
        VIZE_SNAPSHOT_SOURCE_CAPTURE_DIR: ${{ runner.temp }}/native-snapshot-source
      run: |
        set -euo pipefail
        cargo test --locked --profile ci -p vize_canon --lib lsp_client::startup_control::tests::recovery_publication -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/native-recovery-publication-test.log"
        grep -F "test result: ok. 2 passed" "$RUNNER_TEMP/native-recovery-publication-test.log"
    - name: Test actual failed native constructor Drop custody
      shell: bash
      env:
        VIZE_TEST_REQUIRE_TSGO: "1"
        VIZE_SNAPSHOT_SOURCE_CAPTURE_DIR: ${{ runner.temp }}/native-snapshot-source
      run: |
        set -euo pipefail
        unset VIZE_TEST_DISABLE_TSGO
        cargo test --locked --profile ci -p vize_canon --lib lsp_client::startup_control::tests::failed_native_project_open_drop_preserves_exact_nonowning_terminal_custody -- --ignored --exact --nocapture --test-threads=1 | tee "$RUNNER_TEMP/native-failed-project-open-test.log"
        grep -F "test result: ok. 1 passed" "$RUNNER_TEMP/native-failed-project-open-test.log"
    - name: Test legacy projection anchors and complete diagnostic ranges
      shell: bash
      env:
        VIZE_DAVINCI_DIFFERENTIAL_CORPUS: ${{ github.workspace }}
      run: cargo test --locked --profile ci -p vize_canon --features legacy-differential --test davinci_projection_differential -- --nocapture
    - name: Install locked Vue dependency and pinned syntax corpus
      shell: bash
      run: |
        set -euo pipefail
        node tools/support/github/vp-install.ts --filter './npm/builder/vite...' --filter './npm/cli...'
        git submodule update --init --depth 1 -- tests/_fixtures/_git/element-plus
    - name: Test nested sibling narrowing with the actual CLI
      shell: bash
      env:
        VIZE_TEST_REQUIRE_TSGO: "1"
      run: |
        set -euo pipefail
        unset VIZE_TEST_DISABLE_TSGO
        cargo test --locked --profile ci -p vize --test check_flow_depth_isolation_cli -- --nocapture
    - name: Test native syntax, semantic completion and transport refusals
      shell: bash
      env:
        VIZE_TEST_REQUIRE_TSGO: "1"
        VIZE_TEST_REQUIRE_PIN_INPUT_FIXTURE: "1"
        VIZE_NATIVE_SYNTAX_CAPTURE_DIR: ${{ runner.temp }}/native-syntax-semantics
      run: |
        set -euo pipefail
        unset VIZE_TEST_DISABLE_TSGO
        cargo test --locked --profile ci -p vize_canon --test native_syntax_semantics -- --nocapture --test-threads=1
        cargo test --locked --profile ci -p vize_canon --lib generated_diagnostics:: -- --nocapture --test-threads=1
    - name: Test frozen semantic completion and the same native snapshot owner
      shell: bash
      env:
        VIZE_TEST_REQUIRE_TSGO: "1"
        VIZE_SEMANTIC_COMPLETION_CAPTURE_DIR: ${{ runner.temp }}/native-semantic-completion
      run: |
        set -euo pipefail
        unset VIZE_TEST_DISABLE_TSGO
        cargo test --locked --profile ci -p vize_canon --lib batch::executor::session::native_test_receipt::native_semantic_completion::native_semantic_completion_keeps_frozen_full_vector_and_actual_terminal_owner -- --exact --nocapture --test-threads=1 | tee "$RUNNER_TEMP/native-semantic-completion-test.log"
        grep -F "test result: ok. 1 passed" "$RUNNER_TEMP/native-semantic-completion-test.log"
    - name: Verify complete checked source and independent package consumers
      shell: bash
      env:
        CARGO_TARGET_DIR: ${{ github.workspace }}/target
      run: |
        set -euo pipefail
        export SOURCE_SHA="$(git rev-parse HEAD)"
        node tools/support/compat/github/checked-corsa-package-consumer.ts --output "$RUNNER_TEMP/checked-corsa-package-consumer"
    - name: Preserve actual native inputs and responses
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: native-canon-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/native-snapshot-source
          ${{ runner.temp }}/native-setup-drop-test.log
          ${{ runner.temp }}/native-owned-process-poison-test.log
          ${{ runner.temp }}/native-preclose-allocation/
          ${{ runner.temp }}/native-preclose-epochs-test.log
          ${{ runner.temp }}/native-failed-project-open-test.log
          ${{ runner.temp }}/native-recovery-publication-test.log
          ${{ runner.temp }}/native-syntax-semantics
          target/vize-tests/flow-depth-isolation
          ${{ runner.temp }}/native-semantic-completion
          ${{ runner.temp }}/checked-corsa-package-consumer/*.json
          ${{ runner.temp }}/checked-corsa-package-consumer/*.stdout
          ${{ runner.temp }}/checked-corsa-package-consumer/*.stderr
          ${{ runner.temp }}/checked-corsa-package-consumer/package-target/package/*.crate
        if-no-files-found: ignore
        retention-days: 7
