name: Editor conformance

# TS-45 (Davinci P5-12): one LSP scenario with exact expectations, played
# through Neovim, Helix, Zed and VS Code against the real `vize lsp`, judged
# from each client's recorded JSON-RPC transcript. Client pins match the
# editor-host-smoke action (`tests/tooling/editor-conformance.test.ts`
# rejects drift).

on:
  schedule:
    # Daily, offset from the check/native-smoke/e2e crons.
    - cron: "41 4 * * *"
  workflow_dispatch:

concurrency:
  group: editor-conformance-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"

jobs:
  server:
    name: Build the real vize server
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          # Product06a plus only the CLI regression test; no product fix or traces.
          ref: 3f730c98626fef4a3d0e48b43750939514232f00
      # The runner's rustup installs the toolchain pinned in rust-toolchain.toml.
      - name: Install the repository Rust toolchain
        run: |
          rustup --version
          rustup toolchain install || rustup show active-toolchain
          cargo --version
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: editor-conformance
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Build vize CLI
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3f730c98626fef4a3d0e48b43750939514232f00
          cargo build --profile ci -p vize
          mkdir -p "${RUNNER_TEMP}/vize-server"
          cp target/ci/vize "${RUNNER_TEMP}/vize-server/vize"
          {
            echo "producer=$(git rev-parse HEAD)"
            echo "harness=${GITHUB_SHA}"
            echo 'recipe=cargo build --profile ci -p vize'
            rustc --version --verbose
            cargo --version
            sha256sum rust-toolchain.toml Cargo.lock target/ci/vize
          } > "${RUNNER_TEMP}/vize-server/vize-producer.txt"
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - name: Install frozen dependencies for the actual native CLI fixture
        run: vp install --frozen-lockfile --prefer-offline
      - name: Run the unchanged sibling diagnostics completion CLI regression
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/vize-server/completion-sibling-before"
          mkdir -p "$evidence"
          test "$(git rev-parse HEAD)" = 3f730c98626fef4a3d0e48b43750939514232f00
          git diff --exit-code
          {
            echo "producer=$(git rev-parse HEAD)"
            echo "harness=${GITHUB_SHA}"
            echo 'product_baseline=06a51573858160eca1dfe4d54a06f90812f0f6b9'
            echo 'recipe=cargo test --locked --profile ci -p vize --features legacy --message-format=json --test lsp_completion_sibling_overlay_cli -- --nocapture'
            rustc --version --verbose
            cargo --version
            sha256sum rust-toolchain.toml Cargo.lock crates/vize/tests/lsp_completion_sibling_overlay_cli.rs
          } > "$evidence/producer.txt"
          set +e
          cargo test --locked --profile ci -p vize --features legacy --message-format=json --test lsp_completion_sibling_overlay_cli -- --nocapture > "$evidence/cargo.stdout.jsonl" 2> "$evidence/cargo.stderr.log"
          test_status=$?
          set -e
          printf '%s\n' "$test_status" > "$evidence/exit-status.txt"
          capture_status=0
          node --input-type=module - "$evidence" "$test_status" <<'NODE' || capture_status=$?
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const [output, status] = process.argv.slice(2);
          const stdout = fs.readFileSync(path.join(output, 'cargo.stdout.jsonl'), 'utf8');
          const rows = stdout
            .split('\n').flatMap(line => {
              try { return [JSON.parse(line)]; } catch { return []; }
            });
          const artifacts = rows.filter(row => row.reason === 'compiler-artifact'
            && row.target?.name === 'vize' && row.target?.kind?.includes('bin')
            && row.executable);
          assert.equal(artifacts.length, 1, 'one Cargo vize artifact is required');
          const images = [...new Set(artifacts.map(row => row.executable))];
          assert.equal(images.length, 1, 'one Cargo-reported vize binary is required');
          const reported = images[0];
          const actual = fs.realpathSync(reported);
          const bytes = fs.readFileSync(actual);
          assert.equal(bytes.subarray(0, 4).toString('hex'), '7f454c46', 'actual image must be ELF');
          const frozen = path.join(output, 'cargo-reported-vize');
          fs.copyFileSync(actual, frozen);
          const sha256 = createHash('sha256').update(bytes).digest('hex');
          assert.equal(createHash('sha256').update(fs.readFileSync(frozen)).digest('hex'), sha256);
          const producer = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          assert.equal(producer, '3f730c98626fef4a3d0e48b43750939514232f00');
          const runningExactlyOne = /^running 1 test\r?$/m.test(stdout);
          const legacyImages = artifacts.every(row => row.features?.includes('legacy'));
          fs.writeFileSync(path.join(output, 'image-receipt.json'), JSON.stringify({
            producerSha: producer, harnessSha: process.env.GITHUB_SHA,
            productBaselineSha: '06a51573858160eca1dfe4d54a06f90812f0f6b9',
            cargoExitStatus: Number(status),
            runningExactlyOne, legacyImages, cargoArtifacts: artifacts,
            binary: { cargoReportedPath: reported, physicalPath: actual, frozenPath: frozen, sha256 },
            toolchain: fs.readFileSync(path.join(output, 'producer.txt'), 'utf8'),
          }, null, 2) + '\n');
          assert.ok(runningExactlyOne, 'the actual CLI regression must execute exactly one test');
          assert.ok(legacyImages, 'Cargo must attest the legacy feature on the test CLI image');
          NODE
          printf '%s\n' "$capture_status" > "$evidence/capture-status.txt"
          if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
          exit "$capture_status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: vize-server
          path: ${{ runner.temp }}/vize-server/
          if-no-files-found: error
          retention-days: 1

  conformance:
    name: TS-45 ${{ matrix.client }}
    needs: server
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        client: [neovim, helix, zed, vscode]
    env:
      CLIENT: ${{ matrix.client }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vize-server
          path: ${{ runner.temp }}/vize-server
      - name: Make the server executable
        run: |
          chmod +x "${RUNNER_TEMP}/vize-server/vize"
          echo "VIZE_SERVER_PATH=${RUNNER_TEMP}/vize-server/vize" >> "$GITHUB_ENV"

      - name: Install pinned Neovim
        if: matrix.client == 'neovim'
        env:
          NVIM_SHA256: a74740047e73b2b380d63a474282814063d10650cd6cc95efa16d1713c7e616c
          NVIM_VERSION: v0.11.4
        run: |
          set -euo pipefail
          bash .github/actions/vscode-host-smoke/download-artifact.sh \
            "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz" \
            "${RUNNER_TEMP}/nvim.tar.gz" "${NVIM_SHA256}"
          tar -C "${RUNNER_TEMP}" -xzf "${RUNNER_TEMP}/nvim.tar.gz"
          echo "VIZE_TEST_NVIM_PATH=${RUNNER_TEMP}/nvim-linux-x86_64/bin/nvim" >> "$GITHUB_ENV"
          "${RUNNER_TEMP}/nvim-linux-x86_64/bin/nvim" --version | head -1

      - name: Install pinned Helix
        if: matrix.client == 'helix'
        env:
          HELIX_VERSION: 25.07.1
          HELIX_SHA256: 3f08e63ecd388fff657ad39722f88bb03dcf326f1f2da2700d99e1dc40ab2e8b
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/helix-${HELIX_VERSION}-x86_64-linux.tar.xz"
          bash .github/actions/vscode-host-smoke/download-artifact.sh \
            "https://github.com/helix-editor/helix/releases/download/${HELIX_VERSION}/helix-${HELIX_VERSION}-x86_64-linux.tar.xz" \
            "${archive}" "${HELIX_SHA256}"
          mkdir -p "${RUNNER_TEMP}/helix"
          tar -xJf "${archive}" -C "${RUNNER_TEMP}/helix" --strip-components=1
          {
            echo "VIZE_TEST_HELIX_PATH=${RUNNER_TEMP}/helix/hx"
            echo "HELIX_RUNTIME=${RUNNER_TEMP}/helix/runtime"
          } >> "$GITHUB_ENV"
          "${RUNNER_TEMP}/helix/hx" --version
          python3 --version

      - name: Install the repository Rust toolchain for VS Code packaging
        if: matrix.client == 'vscode'
        run: |
          rustup toolchain install || rustup show active-toolchain
          cargo --version
      - name: Setup Rust Script for VS Code packaging
        if: matrix.client == 'vscode'
        uses: ./.github/actions/setup-rust-script
      - name: Stabilize Ubuntu package archive
        if: matrix.client == 'vscode'
        uses: ./.github/actions/setup-ubuntu-archive
      - name: Prepare pinned VS Code
        if: matrix.client == 'vscode'
        env:
          VIZE_TEST_VSCODE_VERSION: "1.107.1"
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            vize-ci-apt-retry sudo apt-get update
            vize-ci-apt-retry sudo apt-get install -y xvfb
          fi
          timeout --signal=TERM --kill-after=10s 300s vp run --workspace-root test:vscode-extension:download

      - name: Exercise existing VS Code configuration and lifecycle contracts
        if: matrix.client == 'vscode'
        env:
          VIZE_TEST_VSCODE_VERSION: "1.107.1"
        run: xvfb-run -a vp run --workspace-root test:vscode-extension:host
      - name: Hydrate pinned create-vue fixture for the original real host suite
        if: matrix.client == 'vscode'
        run: |
          git submodule update --init --force --depth 1 -- tests/_fixtures/_git/create-vue
          test "$(git rev-parse HEAD:tests/_fixtures/_git/create-vue)" = \
            "$(git -C tests/_fixtures/_git/create-vue rev-parse HEAD)"
      - name: Observe the unchanged real VS Code rich authoring contract
        if: matrix.client == 'vscode'
        env:
          VIZE_TEST_VSCODE_VERSION: "1.107.1"
          VIZE_LSP_TRACE_NATIVE_SCOPE: "1"
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/rich-host-evidence"
          cp "${RUNNER_TEMP}/vize-server/vize-producer.txt" "${RUNNER_TEMP}/rich-host-evidence/"
          sha256sum "${VIZE_SERVER_PATH}" > "${RUNNER_TEMP}/rich-host-evidence/consumed-server.sha256"
          git rev-parse HEAD > "${RUNNER_TEMP}/rich-host-evidence/harness-sha.txt"
          git diff --exit-code
          cat > "${RUNNER_TEMP}/rich-host-tap" <<'TAP'
          #!/bin/sh
          exec node "$GITHUB_WORKSPACE/tests/editor-conformance/lsp-tap.mjs" "$VIZE_REAL_SERVER_PATH" "$@"
          TAP
          chmod +x "${RUNNER_TEMP}/rich-host-tap"
          VIZE_REAL_SERVER_PATH="${VIZE_SERVER_PATH}" \
            VIZE_SERVER_PATH="${RUNNER_TEMP}/rich-host-tap" \
            VIZE_CONFORMANCE_TRANSCRIPT="${RUNNER_TEMP}/rich-host-evidence/protocol.jsonl" \
            VIZE_RICH_CUSTODY_OUTPUT="${RUNNER_TEMP}/rich-host-evidence/public-api.json" \
            xvfb-run -a vp run --workspace-root test:vscode-extension:host-real
      - name: Retain VS Code configuration and lifecycle evidence
        if: ${{ always() && matrix.client == 'vscode' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-configuration-lifecycle
          path: |
            ${{ runner.temp }}/rich-host-evidence/
            editors/vscode/.vscode-test/host-smoke-real/failure/
            editors/vscode/.vscode-test/host-smoke/failure/
            editors/vscode/.vscode-test/host-smoke/output-channel/
            editors/vscode/.vscode-test/host-smoke/fake-server/events.jsonl
            editors/vscode/.vscode-test/host-smoke/fake-server/existing-config-events/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Play the TS-45 scenario
        env:
          VIZE_TEST_VSCODE_VERSION: "1.107.1"
        run: |
          set -euo pipefail
          if [ "${CLIENT}" = "vscode" ]; then
            xvfb-run -a node tests/editor-conformance/run.ts "${CLIENT}" --out "${RUNNER_TEMP}/ts45"
          else
            node tests/editor-conformance/run.ts "${CLIENT}" --out "${RUNNER_TEMP}/ts45"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ts45-${{ matrix.client }}
          # Failed-only reruns replace this client's result while keeping the
          # artifacts from clients that already passed in an earlier attempt.
          overwrite: true
          path: ${{ runner.temp }}/ts45
          retention-days: 14

  report:
    name: TS-45 results
    needs: conformance
    if: always()
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: false
          run-install: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ts45-*
          merge-multiple: true
          path: ${{ runner.temp }}/ts45
      - name: Render the multi-client table
        run: node tests/editor-conformance/report.ts "${RUNNER_TEMP}/ts45" --require helix,neovim,vscode,zed
