name: Editor conformance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: PTY probe
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Compare Python and TypeScript PTY helpers
        run: |
          set -u
          script --version; python3 --version; node --version
          git show origin/main:tests/tooling/support/pty-command.py > "$RUNNER_TEMP/pty-command.py"
          git show origin/main:tests/editor-conformance/drivers/pty-bridge.py > "$RUNNER_TEMP/pty-bridge.py"
          for impl in py ts; do
            if [ $impl = py ]; then cmd="python3 $RUNNER_TEMP/pty-command.py"; bridge="python3 $RUNNER_TEMP/pty-bridge.py"; else cmd="node tests/tooling/support/pty-command.ts"; bridge="node tests/editor-conformance/drivers/pty-bridge.ts"; fi
            echo "=== $impl prompt"
            $cmd 'Proceed? [y/N]' $'n\n' sh -c 'printf "Proceed? [y/N] "; read a; echo "got $a"; stty size; tty >/dev/null && echo tty; exit 3' > "$RUNNER_TEMP/$impl-prompt.out"; echo "rc=$?"
            od -c "$RUNNER_TEMP/$impl-prompt.out"
            echo "=== $impl unanswered"
            $cmd never x sh -c 'echo hi; exit 4' | od -c; echo "rc=${PIPESTATUS[0]}"
            echo "=== $impl exit"
            $cmd hi x sh -c 'echo hi; exit 4' >/dev/null; echo "rc=$?"
            echo "=== $impl usage"
            $cmd a b; echo "rc=$?"
            echo "=== $impl deadline with evidence"
            VIZE_PTY_EVIDENCE="$RUNNER_TEMP/ev-$impl" $cmd never x sh -c 'git -C /tmp rev-parse HEAD 2>/dev/null; sleep 300 | cat' > /dev/null; echo "rc=$?"
            wc -l "$RUNNER_TEMP"/ev-$impl.*.jsonl; head -c 1500 "$RUNNER_TEMP"/ev-$impl.*.jsonl; echo; tail -n 2 "$RUNNER_TEMP"/ev-$impl.*.jsonl
            pgrep -fa "sleep 300" || echo "no survivors"
            echo "=== $impl bridge"
            ED='stty -icanon -echo min 1; printf "\033[c"; dd bs=1 count=9 2>/dev/null | od -c | head -1; stty size; stty icanon; read k; echo "key:$k"; exit 5'
            (sleep 1; printf 'abc\n'; sleep 9) | $bridge --cols 120 --rows 40 --screen "$RUNNER_TEMP/screen-$impl" -- sh -c "$ED"; echo "rc=$?"
            od -c "$RUNNER_TEMP/screen-$impl"
          done
          cmp "$RUNNER_TEMP/py-prompt.out" "$RUNNER_TEMP/ts-prompt.out" && echo PROMPT-IDENTICAL
          cmp "$RUNNER_TEMP/screen-py" "$RUNNER_TEMP/screen-ts" && echo SCREEN-IDENTICAL
      - name: PTY tests
        run: |
          node --test --test-reporter=spec tests/tooling/pty-lifecycle-evidence.test.ts tests/tooling/release-cli-dispatch.test.ts
          node --test --test-reporter=spec --test-name-pattern="controlling terminal" tests/tooling/task-shell.test.ts
