name: Original release445 typechecker negative packets

on:
  push:
    branches: [diag/app-typecheck-negative-packets-605429-20261011]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
  PACKET_DIR: ${{ runner.temp }}/original-typechecker-negative-packets
  PACKET_DRIVER_SHA: ${{ github.sha }}

jobs:
  original-negative-packets:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout diagnostic driver
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Save observer outside the product checkout
        shell: bash
        run: |
          mkdir -p "$PACKET_DIR"
          cp tools/diagnostics/app-negative-packets.py "$RUNNER_TEMP/app-negative-packets.py"
          cp .github/workflows/diag-app-negative-packets.yml "$PACKET_DIR/driver-workflow.yml"
          git rev-parse HEAD > "$PACKET_DIR/driver-git-sha"
          sha256sum "$RUNNER_TEMP/app-negative-packets.py" > "$PACKET_DIR/driver-sha256"
      - name: Checkout immutable original producer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 605429c660b328bb03bec5bbfef15961e59fcaf0
          persist-credentials: false
      - name: Hydrate original pinned full authored contexts
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 605429c660b328bb03bec5bbfef15961e59fcaf0
          git submodule update --init --recursive --depth 1 -- tests/_fixtures/_git/element-plus tests/_fixtures/_git/hoppscotch
      - name: Setup original Rust toolchain
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
      - uses: ./.github/actions/setup-rust-script
      - name: Setup original Wild linker
        uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: diag-app-negative-original445
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.cachekey }}
      - name: Setup original Vite and Node
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - uses: ./.github/actions/setup-moonbit
      - name: Install original frozen workspace dependencies
        shell: bash
        run: |
          vp install --frozen-lockfile --prefer-offline \
            --filter './tests...' --filter './npm/native...' --filter './npm/cli...' \
            --filter './npm/builder/vite...' --filter './npm/framework/nuxt-lint-config...' \
            --filter './npm/oxlint...' --filter './npm/framework/nuxt...' \
            --filter './npm/builder/vite-musea...' --filter './npm/framework/musea-nuxt...'
      - name: Build immutable CLI
        shell: bash
        run: cargo build --profile ci -p vize
      - name: Authenticate and retain original negative packets
        shell: bash
        run: |
          command -v strace
          python3 "$RUNNER_TEMP/app-negative-packets.py"
      - name: Retain whole packets including genuine failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: original445-typechecker-negative-whole-packets-${{ github.run_id }}
          path: ${{ env.PACKET_DIR }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
