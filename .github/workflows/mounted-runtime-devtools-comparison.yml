name: Mounted runtime devtools comparison
run-name: Bounded patterned exit capture @ ${{ github.sha }}
# Temporary diagnostic branch only: restore the original workflow before a PR.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-exit:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Create separate immutable source and dependency scopes
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.14.0
          git worktree add --detach "$RUNNER_TEMP/patterned-historical" 9b6a83d95ffc0f555d120323c94c8c3ea9b7f333
          git worktree add --detach "$RUNNER_TEMP/patterned-current" 2cb20631e67097389c09aa4ec278f323fc923e19
          for scope in historical current; do
            (
              cd "$RUNNER_TEMP/patterned-$scope"
              vp install --filter vize-workspace --filter @vize/tests --frozen-lockfile --prefer-offline --ignore-scripts
            )
          done
      - name: Capture exactly six ordinary children and three synthetic controls
        run: |
          node tools/support/compat/github/patterned-exit-capture/capture.mjs \
            "$RUNNER_TEMP/patterned-historical" \
            "$RUNNER_TEMP/patterned-current" \
            "$RUNNER_TEMP/patterned-exit-evidence"
      - name: Preserve complete outcomes even when a child crashes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patterned-exit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/patterned-exit-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
