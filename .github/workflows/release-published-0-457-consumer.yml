name: Verify published v0.457.0 Deno consumer
on:
  workflow_dispatch:
permissions: { contents: read, actions: read, checks: read, statuses: read, pull-requests: read }
concurrency:
  group: published-v0-457-consumer
  cancel-in-progress: false
jobs:
  proof:
    if: github.repository == 'ubugeeei-prod/vize' && github.ref == 'refs/heads/main'
    name: Verify original published Deno consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ github.workflow_sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: package.json, run-install: false }
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with: { toolchain: "1.99.1" }
      - uses: ./.github/actions/setup-rust-script
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with: { deno-version: "2.9.7" }
      - name: Authenticate original publication and run its public Deno assertions
        run: node tools/commands/release/verify-published-0.457.0.ts "$RUNNER_TEMP/published-v0457-proof"
      - name: Retain the supplementary proof including failure observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-v0457-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/published-v0457-proof/proof.json
          if-no-files-found: error
          retention-days: 90
