name: Diagnostic bounded native image authentication
run-name: Diagnostic bounded native image authentication @ ${{ inputs.source_sha }}

# Temporary diagnostic branch only; this workflow never lands.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed diagnostic SHA (must equal the dispatched ref)
        required: true
        type: string

permissions: { contents: read }
concurrency:
  group: diagnostic-native-image-streaming-${{ inputs.source_sha }}
  cancel-in-progress: false
env: { CARGO_TERM_COLOR: always, FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true }

jobs:
  vue-parity:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
      DIAGNOSTIC_SOURCE: ${{ inputs.source_sha }}
      DIAGNOSTIC_BASE: 2b0cf6c084ea0d4ab0a3dce33cfb9ebf0e7c8db2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ inputs.source_sha }}", fetch-depth: 2, persist-credentials: false }
      - name: Authenticate the failed source plus the reviewed streaming patch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIAGNOSTIC_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/diag/native-image-streaming-20261017
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_SOURCE"
          test "$GITHUB_SHA" = "$DIAGNOSTIC_SOURCE"
          test "$GITHUB_WORKFLOW_SHA" = "$DIAGNOSTIC_SOURCE"
          test "$(git rev-parse HEAD^)" = "$DIAGNOSTIC_BASE"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const changed = execFileSync('git', ['diff', '--name-only', process.env.DIAGNOSTIC_BASE, 'HEAD'], { encoding: 'utf8' }).trim().split('\n').sort();
          assert.deepEqual(changed, [
            '.github/workflows/lsp-current-baseline.yml',
            'crates/vize_canon/src/lsp_client/editor_lsp/native_shutdown.rs',
            'crates/vize_canon/src/lsp_client/editor_lsp/native_shutdown/tests.rs',
          ]);
          for (const [file, blob] of [
            ['crates/vize_canon/src/lsp_client/editor_lsp/native_shutdown.rs', 'cb4d28605658b8e6f0ba180b22b517b2a157e380'],
            ['crates/vize_canon/src/lsp_client/editor_lsp/native_shutdown/tests.rs', '3f94ee6edff08741fda87cc606b1e51fe10b113a'],
          ]) assert.equal(execFileSync('git', ['hash-object', file], { encoding: 'utf8' }).trim(), blob);
          JS
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: package.json, cache: true, run-install: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with: { key: vue-parity, cache-key-suffix: "${{ runner.os }}-${{ runner.arch }}" }
      - name: Verify the original toolchain before the unchanged workload
        run: |
          test "$(node --version)" = v24.14.0
          [[ "$(rustc --version)" == "rustc 1.99.1 "* ]]
      - name: Run the complete original Vue parity action once
        uses: ./.github/actions/check-vue-parity
      - name: Retain physical provider identity and unchanged source inputs after measurement
        if: ${{ always() }}
        run: |
          set -euo pipefail
          evidence=target/vize-tests/metrics/native-image-streaming-diagnostic
          mkdir -p "$evidence"
          git diff "$DIAGNOSTIC_BASE" HEAD > "$evidence/diagnostic.patch"
          git status --short > "$evidence/status.txt"
          printf 'source=%s\noriginal=%s\nlanding=a64db672ca290dafa147a4881d45351e678176a3\n' "$DIAGNOSTIC_SOURCE" "$DIAGNOSTIC_BASE" > "$evidence/source-identities.txt"
          git submodule status > "$evidence/submodules.txt"
          lscpu > "$evidence/cpu.txt"
          cargo --version > "$evidence/cargo.txt"
          rustc --version > "$evidence/rustc.txt"
          node --version > "$evidence/node.txt"
          cp Cargo.toml "$evidence/Cargo.toml"
          sha256sum Cargo.lock .github/actions/check-vue-parity/action.yml tests/_fixtures/vue-ecosystem-fixtures.json crates/vize_canon/src/lsp_client/editor_lsp/native_shutdown.rs > "$evidence/source-files.sha256"
          image=node_modules/@typescript/typescript-linux-x64/lib/tsc
          sha256sum "$image" > "$evidence/native-image.sha256"
          stat -L --format='%s' "$image" > "$evidence/native-image.bytes"
          test "$(cat "$evidence/native-image.bytes")" = 24101026
          test "$(cut -d ' ' -f 1 "$evidence/native-image.sha256")" = 4f2de678286401759b3fb4475bafe35b8f32b4b3a07d92642bbf37eadc9b34a4
          printf '%s\n' 'Original churn does not capture raw session wires or individual capability decisions; no capture/trace environment was added during measurement.' > "$evidence/evidence-limit.txt"
      - name: Run complete native authentication and shutdown controls after measurement
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p target/vize-tests/metrics/native-image-streaming-diagnostic
          cargo test --locked --profile ci -p vize_canon --lib native_shutdown::tests -- --nocapture \
            2>&1 | tee target/vize-tests/metrics/native-image-streaming-diagnostic/native-authentication-controls.log
      - name: Retain complete original metrics, custody, and diagnostic source evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-image-streaming-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/ci/vize.differential-build.json
            target/differential/lsp-sessions/
            target/vize-tests/metrics/
          if-no-files-found: error
          retention-days: 7
