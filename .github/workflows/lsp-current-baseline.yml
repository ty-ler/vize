name: Diagnostic native image authentication
run-name: Diagnostic native image authentication @ ${{ inputs.source_sha }}

# Temporary diagnostic branch only. This workflow and instrumentation never land.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed diagnostic SHA (must equal the dispatched ref)
        required: true
        type: string

permissions: { contents: read }
concurrency:
  group: diagnostic-native-image-authentication-${{ inputs.source_sha }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"

jobs:
  incremental:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 40
    env:
      DIAGNOSTIC_SOURCE: ${{ inputs.source_sha }}
      DIAGNOSTIC_BASE: e2b883eed6378eb7ada73bf0220d89a185a3d6fd
      RAYON_NUM_THREADS: "4"
      VIZE_PERF_BUDGET_SCALE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ inputs.source_sha }}", fetch-depth: 2, persist-credentials: false }
      - name: Authenticate the frozen source and diagnostic-only delta
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIAGNOSTIC_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/diag/vben-native-image-hash-20261017
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_SOURCE"
          test "$GITHUB_SHA" = "$DIAGNOSTIC_SOURCE"
          test "$GITHUB_WORKFLOW_SHA" = "$DIAGNOSTIC_SOURCE"
          test "$(git rev-parse HEAD^)" = "$DIAGNOSTIC_BASE"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const changed = execFileSync('git', ['diff', '--name-only', process.env.DIAGNOSTIC_BASE, 'HEAD'], { encoding: 'utf8' }).trim().split('\n').sort();
          assert.deepEqual(changed, [
            '.github/workflows/lsp-current-baseline.yml',
            'crates/vize_canon/src/lsp_client/editor_lsp/native_shutdown.rs',
          ]);
          JS
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: package.json, cache: true, run-install: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with: { key: vue-parity, cache-key-suffix: "${{ runner.os }}-${{ runner.arch }}" }
      - name: Hydrate the two unchanged pinned workloads and locked runtime
        run: |
          git submodule update --init --depth 1 tests/_fixtures/_git/misskey tests/_fixtures/_git/vue-vben-admin
          vp install --frozen-lockfile --prefer-offline
      - name: Record source, native image, runner, and exact Cargo profile
        run: |
          test "$(node --version)" = v24.14.0
          [[ "$(rustc --version)" == "rustc 1.99.1 "* ]]
          mkdir -p target/vize-tests/metrics/native-image-diagnostic
          git diff "$DIAGNOSTIC_BASE" HEAD > target/vize-tests/metrics/native-image-diagnostic/diagnostic.patch
          git submodule status > target/vize-tests/metrics/native-image-diagnostic/submodules.txt
          sha256sum node_modules/@typescript/typescript-linux-x64/lib/tsc > target/vize-tests/metrics/native-image-diagnostic/native-image.sha256
          stat -L --format='%s' node_modules/@typescript/typescript-linux-x64/lib/tsc > target/vize-tests/metrics/native-image-diagnostic/native-image.bytes
          lscpu > target/vize-tests/metrics/native-image-diagnostic/cpu.txt
          cargo --version > target/vize-tests/metrics/native-image-diagnostic/cargo.txt
          rustc --version > target/vize-tests/metrics/native-image-diagnostic/rustc.txt
          node --version > target/vize-tests/metrics/native-image-diagnostic/node.txt
          cp Cargo.toml target/vize-tests/metrics/native-image-diagnostic/Cargo.toml
      - name: Build and receipt the original CI-profile server with passive timing
        run: |
          set -euo pipefail
          cargo build --profile ci -p vize --features legacy 2>&1 | tee target/vize-tests/metrics/native-image-diagnostic/cargo-build.log
          node tests/differential/build-receipt.ts --legacy
      - name: Run both original incremental tests once with unchanged failfast budgets
        env:
          VIZE_LSP_BIN: ${{ github.workspace }}/target/ci/vize
          VIZE_LSP_REQUIRE_SOURCE_BUILD: "1"
          VIZE_LSP_BUILD_RECIPE: cargo build --profile ci -p vize --features legacy
          VIZE_TRACE_EDITOR_PREPARATION: "1"
        run: |
          set -euo pipefail
          /usr/bin/time -v -o target/vize-tests/metrics/native-image-diagnostic/process-time.txt \
            vp run --no-cache --filter './tests' test:performance:lsp-incremental \
            2>&1 | tee target/vize-tests/metrics/native-image-diagnostic/test.log
      - name: Retain full raw sessions, build receipt, phase traces, and original metrics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vben-native-image-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/ci/vize.differential-build.json
            target/differential/lsp-sessions/
            target/vize-tests/metrics/native-image-diagnostic/
            target/vize-tests/metrics/misskey-lsp-incremental/
            target/vize-tests/metrics/vben-lsp-incremental/
          if-no-files-found: error
          retention-days: 7
