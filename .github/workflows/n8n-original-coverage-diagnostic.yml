name: Original n8n coverage diagnostic
on:
  push:
    branches: [ci/n8n-original-coverage-diagnostic-20261011]
    paths:
      - .github/workflows/n8n-original-coverage-diagnostic.yml
      - tools/support/ci/n8n-original-coverage-diagnostic.py
  workflow_dispatch: {}
permissions: { contents: read }
concurrency:
  group: original-n8n-coverage-diagnostic-${{ github.sha }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
  VIZE_NUXT_CONFIG_ITERATIONS: "100"
jobs:
  frozen-original:
    if: github.ref == 'refs/heads/ci/n8n-original-coverage-diagnostic-20261011'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 2ce2d2b75cfa9ba14f322a99de8f7146b623b8fe
          path: frozen-source
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa
        with: { node-version-file: package.json, cache: true, run-install: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: stable, components: llvm-tools-preview }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-moonbit
      - uses: ./.github/actions/setup-rust-script
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: coverage-source
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
          target-path: frozen-source/target
      - name: Install unchanged frozen JavaScript and runtime dependencies
        working-directory: frozen-source
        run: vp install --frozen-lockfile --prefer-offline
      - name: Install original Pkl CLI
        run: npm install --global @pkl-community/pkl@0.27.2
      - uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1
        with: { tool: cargo-llvm-cov }
      - name: Compile original workspace with original coverage instrumentation
        working-directory: frozen-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original-n8n-coverage"
          test "$(git rev-parse HEAD)" = 2ce2d2b75cfa9ba14f322a99de8f7146b623b8fe
          python3 "$GITHUB_WORKSPACE/tools/support/ci/n8n-original-coverage-diagnostic.py" "$PWD" "$RUNNER_TEMP/original-n8n-coverage" --before-build
          cargo llvm-cov --version > "$RUNNER_TEMP/original-n8n-coverage/cargo-llvm-cov-version.txt"
          rustc -vV > "$RUNNER_TEMP/original-n8n-coverage/rustc-version.txt"
          cargo llvm-cov show-env --sh > "$RUNNER_TEMP/original-n8n-coverage/coverage-environment.sh"
          source "$RUNNER_TEMP/original-n8n-coverage/coverage-environment.sh"
          cargo test --tests --workspace --no-run --message-format=json > "$RUNNER_TEMP/original-n8n-coverage/build.stdout.jsonl" 2> "$RUNNER_TEMP/original-n8n-coverage/build.stderr"
      - name: Measure finite original full-suite concurrency and child ownership
        working-directory: frozen-source
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/original-n8n-coverage/coverage-environment.sh"
          python3 "$GITHUB_WORKSPACE/tools/support/ci/n8n-original-coverage-diagnostic.py" "$PWD" "$RUNNER_TEMP/original-n8n-coverage"
      - name: Preserve every original output and process custody sample
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: original-n8n-coverage-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/original-n8n-coverage
          if-no-files-found: error
          retention-days: 3
