name: Release Operator

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Start, patch, resume, retire, or verify the reviewed 0.457.0 Deno consumer repair
        type: choice
        options: [start, patch, resume, retire, consumer-repair, accept-consumer-repair]
        default: start
        required: true
      source_cut:
        description: Exact reviewed stable C; required only for patch
        type: string
        default: ""
        required: false
      source_pr:
        description: Original source PR number; required for resume, retire and consumer-repair
        type: string
        default: ""
        required: false
      source_head:
        description: Exact original 40-hex source head; required for retire and consumer-repair
        type: string
        default: ""
        required: false
      source_tag:
        description: Exact original v0.minor.0 tag; required for retire and consumer-repair
        type: string
        default: ""
        required: false
      release_run:
        description: Original Release workflow run ID; required for retire and consumer-repair
        type: string
        default: ""
        required: false
      consumer_operator_run:
        description: Successful supplemental operator run; only accept-consumer-repair accepts this input
        type: string
        default: ""
        required: false
      consumer_policy_sha:
        description: Exact reviewed main SHA of that supplemental operator; only accept-consumer-repair
        type: string
        default: ""
        required: false
      operator_run:
        description: Original Release Operator entry run ID; required only for retire
        type: string
        default: ""
        required: false

permissions: { contents: read }

# Do not share Release's release-candidates group: the operator waits on that run.
concurrency:
  group: release-operator
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  operator:
    if: github.repository == 'ubugeeei-prod/vize' && github.ref == 'refs/heads/main'
    name: ${{ inputs.operation == 'consumer-repair' && 'Authorize the supplemental Deno consumer' || inputs.operation == 'accept-consumer-repair' && 'Accept the supplemental Deno consumer' || 'Run the official pinned release operator' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # Configure main-only deployment branches before adding the user credential.
    environment: release-operator
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          run-install: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with: { toolchain: "1.99.1" }
      - uses: ./.github/actions/setup-rust-script

      - name: Install the frozen graph
        run: vp install --frozen-lockfile

      - name: Authorize the existing maintainer user and invoke the public release command
        env:
          GH_TOKEN: ${{ secrets.RELEASE_OPERATOR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_OPERATOR_TOKEN }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          RELEASE_SOURCE_CUT: ${{ inputs.source_cut }}
          RELEASE_SOURCE_PR: ${{ inputs.source_pr }}
          RELEASE_SOURCE_HEAD: ${{ inputs.source_head }}
          RELEASE_SOURCE_TAG: ${{ inputs.source_tag }}
          RELEASE_RUN: ${{ inputs.release_run }}
          RELEASE_CONSUMER_OPERATOR_RUN: ${{ inputs.consumer_operator_run }}
          RELEASE_CONSUMER_POLICY_SHA: ${{ inputs.consumer_policy_sha }}
          RELEASE_ORIGINAL_OPERATOR_RUN: ${{ inputs.operator_run }}
          VIZE_RELEASE_OPERATOR_TIMEOUT_SECONDS: "14400"
          VIZE_RELEASE_EXPECTED_CUT_SHA: ${{ (inputs.operation == 'start' || inputs.operation == 'patch') && github.sha || '' }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::Missing protected maintainer user credential"; exit 1; }
          login=$(gh api user --jq 'select(.type == "User") | .login')
          test -n "$login" && test "$login" = "$GITHUB_ACTOR" && test "$login" = "$GITHUB_TRIGGERING_ACTOR" || { echo "::error::The user credential must belong to the original and current triggering maintainer"; exit 1; }
          case "$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$login/permission" --jq '.role_name')" in
            maintain|admin) ;;
            *) echo "::error::The release operator requires maintain or admin"; exit 1 ;;
          esac
          id=$(gh api user --jq '.id')
          git config user.name "$login"
          git config user.email "$id+$login@users.noreply.github.com"
          gh auth setup-git --hostname github.com
          if [[ "$RELEASE_OPERATION" != "accept-consumer-repair" && ( -n "$RELEASE_CONSUMER_OPERATOR_RUN" || -n "$RELEASE_CONSUMER_POLICY_SHA" ) ]]; then
            echo "::error::Only accept-consumer-repair accepts supplemental run/policy inputs"; exit 1
          fi
          case "$RELEASE_OPERATION" in
            start|patch|resume)
              [[ -z "$RELEASE_SOURCE_HEAD" && -z "$RELEASE_SOURCE_TAG" && -z "$RELEASE_RUN" && -z "$RELEASE_ORIGINAL_OPERATOR_RUN" ]] || { echo "::error::Only retire and consumer-repair accept source head, tag and Release run inputs; only retire accepts an original operator run"; exit 1; }
              ;;
          esac
          if [[ "$RELEASE_OPERATION" != "patch" && -n "$RELEASE_SOURCE_CUT" ]]; then
            echo "::error::Only patch accepts an explicit stable cut"; exit 1
          fi
          case "$RELEASE_OPERATION" in
            patch)
              test -z "$RELEASE_SOURCE_PR" || { echo "::error::A stable patch cannot reuse a source PR input"; exit 1; }
              [[ "$RELEASE_SOURCE_CUT" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Patch requires exact reviewed policy and stable C identities"; exit 1; }
              rust-script tools/commands/release/pr.rs start-stable "$GITHUB_SHA" "$RELEASE_SOURCE_CUT"
              ;;
            start)
              test -z "$RELEASE_SOURCE_PR" || { echo "::error::A fresh cut cannot reuse a source PR input"; exit 1; }
              vp run release minor -y --pin
              ;;
            resume)
              [[ "$RELEASE_SOURCE_PR" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Resume requires the original positive source PR number"; exit 1; }
              vp run release --resume "$RELEASE_SOURCE_PR" --pin
              ;;
            consumer-repair)
              test "$RELEASE_SOURCE_PR" = "9196" && test "$RELEASE_SOURCE_HEAD" = "03882089eff75664abe99ba71868e33739496b01" && test "$RELEASE_SOURCE_TAG" = "v0.457.0" && test "$RELEASE_RUN" = "38805261385" && test -z "$RELEASE_ORIGINAL_OPERATOR_RUN" || { echo "::error::Consumer repair accepts only the reviewed immutable 0.457.0 tuple"; exit 1; }
              echo "Protected maintainer authorization passed; the read-only consumer runs on a separate runner."
              ;;
            accept-consumer-repair)
              node tools/support/release/consumer_repair/close.ts
              ;;
            retire)
              [[ "$RELEASE_SOURCE_PR" =~ ^[1-9][0-9]*$ && "$RELEASE_RUN" =~ ^[1-9][0-9]*$ && "$RELEASE_ORIGINAL_OPERATOR_RUN" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Retire requires positive source PR, Release run and original operator run IDs"; exit 1; }
              [[ "$RELEASE_SOURCE_HEAD" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::Retire requires the exact 40-hex source head"; exit 1; }
              [[ "$RELEASE_SOURCE_TAG" =~ ^v0\.[1-9][0-9]*\.0$ ]] || { echo "::error::Retire requires the original v0.minor.0 tag"; exit 1; }
              rust-script tools/commands/release/pr.rs retire "$RELEASE_SOURCE_PR" "$RELEASE_SOURCE_HEAD" "$RELEASE_SOURCE_TAG" "$RELEASE_RUN" "$RELEASE_ORIGINAL_OPERATOR_RUN"
              ;;
            *) echo "::error::Unknown release operation"; exit 1 ;;
          esac

      - name: Retain the source closure intent and verification packet
        if: always() && inputs.operation == 'accept-consumer-repair'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-457-composite-acceptance
          path: ${{ runner.temp }}/release-457-composite-acceptance/
          if-no-files-found: error
          retention-days: 90

  supplemental-consumer:
    if: inputs.operation == 'consumer-repair' && github.repository == 'ubugeeei-prod/vize' && github.ref == 'refs/heads/main'
    needs: operator
    name: Verify the supplemental Deno consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: { contents: read, actions: read }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24", package-manager-cache: false }
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with: { deno-version: "2.9.7", cache: false }
      - name: Execute the unchanged immutable consumer using only a read credential
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          RELEASE_SOURCE_CUT: ${{ inputs.source_cut }}
          RELEASE_SOURCE_PR: ${{ inputs.source_pr }}
          RELEASE_SOURCE_HEAD: ${{ inputs.source_head }}
          RELEASE_SOURCE_TAG: ${{ inputs.source_tag }}
          RELEASE_RUN: ${{ inputs.release_run }}
          RELEASE_ORIGINAL_OPERATOR_RUN: ${{ inputs.operator_run }}
        run: node tools/support/release/consumer_repair/capture.ts
      - name: Retain the complete supplemental consumer packet
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-457-consumer-repair
          path: ${{ runner.temp }}/release-457-consumer-repair/
          if-no-files-found: error
          retention-days: 90
