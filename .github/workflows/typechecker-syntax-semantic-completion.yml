name: Native syntax and semantic completion
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Complete immutable commit SHA for the composed source
        required: true
        type: string
      scope:
        description: Full qualification or the original pinned ReKa component contract
        type: choice
        options: [all, reka-pininput]
        default: all
permissions:
  contents: read
concurrency:
  group: typechecker-syntax-completion-${{ inputs.source_ref }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  QUALIFIER_SHA: ${{ inputs.source_ref }}
  QUALIFIER_SCOPE: ${{ inputs.scope }}
jobs:
  native-syntax-completion:
    runs-on: ${{ inputs.scope == 'reka-pininput' && 'ubuntu-24.04' || 'blacksmith-32vcpu-ubuntu-2404' }}
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.QUALIFIER_SHA }}
          persist-credentials: false
      - name: Authenticate the complete source
        run: |
          [[ "$QUALIFIER_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$QUALIFIER_SHA"
          mkdir -p target/native-syntax-completion
          git rev-parse HEAD > target/native-syntax-completion/source.sha
          git ls-files -s > target/native-syntax-completion/whole-source-index.txt
          case "$QUALIFIER_SCOPE" in all|reka-pininput) ;; *) exit 1 ;; esac
          if [[ "$QUALIFIER_SCOPE" == reka-pininput ]]; then test "$QUALIFIER_SHA" = "$GITHUB_SHA"; fi
      - name: Hydrate only the original pinned ReKa source
        if: inputs.scope == 'reka-pininput'
        run: git submodule update --init --depth 1 -- tests/_fixtures/_git/reka-ui
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        if: inputs.scope == 'reka-pininput'
        with: { node-version-file: package.json, cache: true, run-install: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        if: inputs.scope == 'reka-pininput'
        with: { toolchain: stable }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        if: inputs.scope == 'reka-pininput'
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        if: inputs.scope == 'reka-pininput'
        with: { key: test-scripts, cache-key-suffix: "${{ runner.os }}-${{ runner.arch }}" }
      - name: Prepare original ReKa providers and the source CLI
        if: inputs.scope == 'reka-pininput'
        env:
          VIZE_APP_CHECK_CAPTURE_DIR: ${{ github.workspace }}/target/native-syntax-completion/reka-packets
        run: |
          set -euo pipefail
          mkdir -p target/native-syntax-completion
          git rev-parse HEAD > target/native-syntax-completion/source.sha
          git ls-files -s > target/native-syntax-completion/whole-source-index.txt
          vp install --frozen-lockfile --prefer-offline --filter . --filter './tests...'
          node tests/_helpers/reka-check-prepare.ts
          cargo build --locked --profile ci -p vize
      - name: Original ReKa snapshot and four public component controls
        if: inputs.scope == 'reka-pininput'
        env:
          VIZE_APP_CHECK_CAPTURE_DIR: ${{ github.workspace }}/target/native-syntax-completion/reka-packets
        run: |
          set -euo pipefail
          node --test tests/snapshots/check/reka-ui.ts 2>&1 | tee target/native-syntax-completion/reka-component-controls.log
      - name: Original complete App E2E check row, sharing its native build
        if: inputs.scope == 'all'
        env:
          VIZE_APP_CHECK_CAPTURE_DIR: ${{ github.workspace }}/target/native-syntax-completion/original-app-packets
        uses: ./.github/actions/app-e2e-row
        with:
          profile: full
          suite: check
          shard: all
          task: test:check
          timeout: 75m
          needs-playwright: "false"
          cache-key: app-e2e-full-check-all
          worktree-id: ci-app-e2e-full-check-all
          artifact-stem: full-check-all
      - name: Actual generator and native completion controls
        if: ${{ !cancelled() && inputs.scope == 'all' }}
        env:
          VIZE_TEST_REQUIRE_TSGO: "1"
          VIZE_TEST_REQUIRE_PIN_INPUT_FIXTURE: "1"
          VIZE_NATIVE_SYNTAX_CAPTURE_DIR: ${{ github.workspace }}/target/native-syntax-completion/packets
        run: |
          set -euo pipefail
          unset VIZE_TEST_DISABLE_TSGO
          qualifier_status=0
          for control in anchors malformed-setup generic jsx native; do
            case "$control" in
              anchors) control_args=(--lib anchors::tests:: -- --nocapture) ;;
              malformed-setup) control_args=(--lib vue_codegen::malformed_setup_tests:: -- --nocapture --test-threads=1) ;;
              generic) control_args=(--lib vue_codegen::generic_component_tests:: -- --nocapture --test-threads=1) ;;
              jsx) control_args=(--lib jsx_codegen::nested_tests:: -- --nocapture) ;;
              native) control_args=(--test native_syntax_semantics -- --nocapture --test-threads=1) ;;
            esac
            set +e
            cargo test --locked --profile ci -p vize_canon "${control_args[@]}" 2>&1 | tee "target/native-syntax-completion/$control.log"
            control_status=("${PIPESTATUS[@]}")
            set -e
            printf '%s %s\n' "${control_status[0]}" "${control_status[1]}" > "target/native-syntax-completion/$control.status"
            if (( control_status[0] != 0 || control_status[1] != 0 )); then qualifier_status=1; fi
          done
          exit "$qualifier_status"
      - name: Retain all whole-source qualification packets
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-syntax-completion-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.QUALIFIER_SHA }}
          path: |
            target/native-syntax-completion/
            target/app-e2e-logs/
            tests/app/results/
            tests/snapshots/check/**/__snapshots__/*.snap.actual
          if-no-files-found: error
          retention-days: 7
