name: Check
run-name: Public union whole original533 qualification @ ${{ github.sha }}
on: { workflow_dispatch: {} }
permissions: { contents: read, actions: read }
env:
  CARGO_BUILD_JOBS: '12'
  CARGO_INCREMENTAL: '0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  VIZE_UI_REQUIRE_SOURCE_BINDING: '1'
jobs:
  ui-union-final533:
    name: Exact public compiler source and all original533 runtime controls
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 40
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { fetch-depth: 0 }
      - name: Select exact three-layer public source with only read-only observers
        run: |
          git checkout 36661df72b1705781c6af73d2a9daff7aace4ad3
          git diff --exit-code
          git diff --cached --exit-code
          mkdir evidence
          git rev-parse HEAD > evidence/source-head.txt
          git diff 3ed139a7c3ee40f51335905b9ca4970650cefdfd HEAD > evidence/public-source-composition.diff
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: scoped-union-props-original-source-receipt-656010281c745dd3df7905be0d8ff16af680d1d0
          run-id: 38113703526
          github-token: ${{ github.token }}
          path: baseline
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: stable }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: '0.9.0' }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          cache-key-prefix: ui-vapor-pairing-533-
          key: test-js-packages
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa
        with: { node-version-file: package.json, cache: true, run-install: false }
      - name: Install actual current source dependencies and build the actual native binding
        run: |
          vp install --frozen-lockfile --prefer-offline
          vp run --filter './npm/native' build:ci
          node scripts/ui-union-final533-proof.mjs binding
          git show 656010281c745dd3df7905be0d8ff16af680d1d0:scripts/ui-scoped-union-proof.mjs > /tmp/emitted-observer.mjs
          node /tmp/emitted-observer.mjs emitted current
          git diff --exit-code -- Cargo.toml Cargo.lock crates davinci npm/ui pnpm-lock.yaml pnpm-workspace.yaml
      - name: Execute unchanged standard and production UI tests
        run: vp run --filter './npm/ui' test 2>&1 | tee evidence/ui-tests.log
      - name: Execute all original UI gates and all mandatory native, official and boundary packets
        run: vp run --filter './npm/ui' check 2>&1 | tee evidence/supported.log
      - name: Require the whole original rc9 controls and four numerical ProgressBar negatives
        env: { VIZE_UI_VAPOR_RUNTIME: reference }
        run: |
          set +e
          vp run --filter './npm/ui' check:vapor-runtime 2>&1 | tee evidence/reference.log
          negative_status=${PIPESTATUS[0]}
          set -e
          test "$negative_status" -eq 1
      - name: Verify whole original fixture order, every full output and remaining authored SSR assertions
        run: node scripts/ui-union-final533-proof.mjs receipt 2>&1 | tee evidence/receipt.log
      - name: Retain current-source full native modules and every original raw output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ui-union-current-source-original533-${{ github.sha }}
          path: evidence/
