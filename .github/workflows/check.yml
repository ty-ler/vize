# PRIVATE DIAGNOSTIC REF ONLY. Never merge this capture-only workflow body.
# The existing main-registered Check identity is used only to dispatch this ref.
name: ProgressBar emitted-output diagnostic (no conformance credit)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: progress-bar-emitted-output-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    name: Compile-only ProgressBar output capture
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
      CARGO_BUILD_JOBS: "12"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Fetch the two immutable UI input objects
        run: git fetch --no-tags --depth=1 origin 588d2c29ceead01ca391ab10eaf59439c8619798 7248841970a7f6385d33649282d59129259bcc7e
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - uses: ./.github/actions/setup-moonbit
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: stable
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: test-js-packages
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Install the original frozen JS dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Build the original native CI producer
        run: vp run --filter './npm/native' build:ci
      - name: Capture complete native SSR, native Vapor, and reference Vapor output
        id: capture
        run: node npm/ui/scripts/vapor-runtime/capture-progress-bar.ts "$RUNNER_TEMP/progress-bar-emitted-output"
      - name: Retain complete emitted text (at most 4 MiB)
        if: ${{ always() && steps.capture.outputs.complete == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: progress-bar-emitted-text-${{ github.sha }}
          path: ${{ runner.temp }}/progress-bar-emitted-output/text/*.txt
          if-no-files-found: error
          compression-level: 9
          retention-days: 3
      - name: Retain source and provider proof (at most 1 MiB)
        if: ${{ always() && steps.capture.outputs.complete == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: progress-bar-emitted-proof-${{ github.sha }}
          path: ${{ runner.temp }}/progress-bar-emitted-output/proof/*.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 3
