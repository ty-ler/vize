name: Check
run-name: UI Vapor 533 source diagnostic @ ${{ github.sha }}
on: { workflow_dispatch: {} }
permissions: { contents: read }
env:
  CARGO_BUILD_JOBS: '12'
  CARGO_INCREMENTAL: '0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  VIZE_UI_REQUIRE_SOURCE_BINDING: '1'
jobs:
  ui-vapor-pairing:
    name: Full original UI controls and paired Vapor source diagnostic
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { fetch-depth: 0 }
      - name: Preserve clean source identity before building
        run: |
          mkdir -p evidence
          git diff --exit-code
          git diff --cached --exit-code
          git rev-parse HEAD > evidence/source-head.txt
          git status --porcelain > evidence/source-status-before.txt
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: stable }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: '0.9.0' }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          cache-key-prefix: ui-vapor-pairing-533-
          key: test-js-packages
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa
        with: { node-version-file: package.json, cache: true, run-install: false }
      - name: Install immutable dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Build the actual source native binding
        run: vp run --filter './npm/native' build:ci
      - name: Verify the source-built binding is actually loaded
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createRequire } from 'node:module';
          import { readFileSync, realpathSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { pathToFileURL } from 'node:url';
          const root=process.env.GITHUB_WORKSPACE;
          const require=createRequire(`${root}/npm/ui/package.json`);
          const native=await import(pathToFileURL(require.resolve('@vizejs/native')).href);
          const expected=realpathSync(`${root}/npm/native/vize-vitrine.linux-x64-gnu.node`);
          const loaded=Object.keys(require.cache).filter(name=>name.endsWith('.node')).map(name=>realpathSync(name));
          assert.ok(loaded.includes(expected), 'actual source binary must be loaded');
          assert.equal(typeof native.compileSfc,'function');
          const receipt={head:process.env.GITHUB_SHA,expected,loaded,
            sha256:createHash('sha256').update(readFileSync(expected)).digest('hex')};
          writeFileSync('evidence/native-binding.json',JSON.stringify(receipt,null,2));
          console.log(JSON.stringify(receipt));
          JS
          git status --porcelain > evidence/source-status-after-native.txt
          git diff -- npm/native > evidence/generated-native-entry.diff
          git diff --exit-code -- Cargo.toml Cargo.lock crates davinci npm/ui pnpm-lock.yaml pnpm-workspace.yaml
      - name: Execute all original standard and production UI tests
        run: vp run --filter './npm/ui' test 2>&1 | tee evidence/ui-tests.log
      - name: Execute all original UI lint, renderer, static, story and supported Vapor gates
        if: always()
        env:
          VIZE_UI_VAPOR_EVIDENCE_DIRECTORY: ${{ github.workspace }}/evidence/supported
        run: vp run --filter './npm/ui' check 2>&1 | tee evidence/ui-supported.log
      - name: Execute the full immutable rc.9 reference workload
        if: always()
        env:
          VIZE_UI_VAPOR_RUNTIME: reference
          VIZE_UI_VAPOR_EVIDENCE_DIRECTORY: ${{ github.workspace }}/evidence/reference
        run: |
          set +e
          vp run --filter './npm/ui' check:vapor-runtime 2>&1 | tee evidence/ui-reference.log
          reference_status=${PIPESTATUS[0]}
          set -e
          test "$reference_status" -eq 1
          node scripts/ui-vapor-reference-negative.mjs
      - name: Preserve every original fixture record and complete log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ui-vapor-pairing-533-${{ github.sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 14
