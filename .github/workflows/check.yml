name: Check
run-name: Scoped union original source receipt @ ${{ github.sha }}
on: { workflow_dispatch: {} }
permissions: { contents: read, actions: read }
env:
  CARGO_BUILD_JOBS: '12'
  CARGO_INCREMENTAL: '0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  VIZE_UI_REQUIRE_SOURCE_BINDING: '1'
jobs:
  ui-scoped-union-receipt:
    name: Strict observer over complete original native before/after source gates
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { fetch-depth: 0 }
      - name: Preserve corrected observer and select the same qualified source
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          cp scripts/ui-scoped-union-proof.mjs /tmp/ui-scoped-union-proof.mjs
          git checkout 6a279bc77f531c95abb58ee5b90c634354ef5f3f
          git diff --exit-code
      - name: Verify every original source guard and product gate actually succeeded
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh api repos/ubugeeei-prod/vize/actions/runs/38112877041 > /tmp/original-run.json
          gh api repos/ubugeeei-prod/vize/actions/jobs/114391906378 > /tmp/original-job.json
          python3 - <<'PYTHON'
          import json
          run=json.load(open('/tmp/original-run.json'))
          job=json.load(open('/tmp/original-job.json'))
          assert run['head_sha']=='9d2cfa2c8cdb8234189679abb658fa654aa7419a'
          assert run['conclusion']=='failure' and job['conclusion']=='failure'
          assert job['run_id']==38112877041
          steps=job['steps']
          assert all(s['conclusion']=='success' for s in steps if s['number'] <= 20)
          failed=[s for s in steps if s['conclusion']=='failure']
          assert len(failed)==1 and failed[0]['number']==21
          assert failed[0]['name']=='Assert complete raw before/after source receipt and unchanged authored SSR markup'
          print('Original exact source, whole goldens, Rust controls, standard/production UI and both full533 lanes all succeeded; only observer expectation needs correction.')
          PYTHON
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: scoped-union-props-exact-before-after-9d2cfa2c8cdb8234189679abb658fa654aa7419a
          run-id: 38112877041
          github-token: ${{ github.token }}
          path: evidence
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: stable }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: '0.9.0' }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          cache-key-prefix: ui-vapor-pairing-533-
          key: test-js-packages
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa
        with: { node-version-file: package.json, cache: true, run-install: false }
      - name: Restore identical source dependencies and actual native binding
        run: |
          vp install --frozen-lockfile --prefer-offline
          vp run --filter './npm/native' build:ci
          node /tmp/ui-scoped-union-proof.mjs binding receipt-evaluator
          git diff --exit-code -- Cargo.toml Cargo.lock crates davinci npm/ui pnpm-lock.yaml pnpm-workspace.yaml
      - name: Check all original full outputs and unchanged authored markup assertions
        run: |
          node /tmp/ui-scoped-union-proof.mjs receipt 2>&1 | tee evidence/corrected-receipt.log
          cp /tmp/ui-scoped-union-proof.mjs evidence/receipt-observer.mjs
          cp /tmp/original-run.json evidence/original-run.json
          cp /tmp/original-job.json evidence/original-job.json
      - name: Preserve original raw source evidence and the strict receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scoped-union-props-original-source-receipt-${{ github.sha }}
          path: evidence/
