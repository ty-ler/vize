name: Check
run-name: LSP navigation arena pair @ ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      allocation-ownership-diagnostic:
        type: boolean
        default: false
permissions: { contents: read }
concurrency:
  group: lsp-navigation-arena-pair-${{ github.sha }}
  cancel-in-progress: false
jobs:
  allocation-ownership-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/lsp-navigation-arena-pair-20261011' && inputs.allocation-ownership-diagnostic }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RAYON_NUM_THREADS: "4"
      VIZE_PERF_BUDGET_SCALE: "1"
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { fetch-depth: 0 }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa
        with: { node-version-file: package.json, cache: true, run-install: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: stable, components: clippy }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with: { key: vue-parity, cache-key-suffix: "${{ runner.os }}-${{ runner.arch }}" }
      - name: Hydrate exact unchanged fixture and dependencies once
        run: git submodule update --init --depth 1 -- tests/_fixtures/_git/misskey && vp install --frozen-lockfile --prefer-offline
      - name: Compare actual source with the whole original workload
        run: |
          cp -a tools/diagnostics/lsp-navigation-arena-pair "$RUNNER_TEMP/lsp-arena-pair-driver"
          node "$RUNNER_TEMP/lsp-arena-pair-driver/run.mjs"
      - name: Retain whole original workload counters and maps
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lsp-navigation-arena-pair-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/lsp-navigation-arena-pair/**
            !${{ runner.temp }}/lsp-navigation-arena-pair/*.vize
          if-no-files-found: error
          retention-days: 14
      - name: Retain actual source-built native executables
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lsp-navigation-arena-pair-executables-${{ github.sha }}
          path: |
            ${{ runner.temp }}/lsp-navigation-arena-pair/*.vize
            ${{ runner.temp }}/lsp-navigation-arena-pair/*.build-receipt.json
          retention-days: 14
          if-no-files-found: error
