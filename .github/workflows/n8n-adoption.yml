name: n8n adoption fixture

on:
  pull_request:
    paths:
      - .github/workflows/n8n-adoption.yml
      - .gitmodules
      - tests/_fixtures/_git/n8n
      - tests/_fixtures/n8n-adoption.json
      - tests/_fixtures/n8n-cli-adoption.json
      - tests/_fixtures/vue-ecosystem-fixtures.json
      - tests/tooling/n8n-adoption-fixture.test.mjs
      - tests/tooling/n8n-cli-config-contract.test.mjs
      - tests/tooling/n8n-cli-config-failure-custody.test.mjs
      - tests/tooling/support/n8n-cli-config-*.mjs
      - tests/tooling/support/n8n-slot-options-acceptance.ts
      - tests/tooling/patina-slot-dynamic-modifiers-oracle.test.ts
      - tests/_fixtures/differential/lint/n8n-cli-config/**
      - tests/_fixtures/differential/lint/slot-dynamic-modifiers-8142/**
      - tests/tooling/support/n8n-compiler-*.mjs
      - tests/tooling/support/n8n-default-slot-loop*.mjs
      - tests/_fixtures/differential/compiler/n8n-*/**
      - tools/support/compat/n8n-official-compiler-custody.mjs
      - crates/vize_atelier_sfc/**
      - crates/vize_atelier_core/**
      - crates/vize_atelier_dom/**
      - davinci/vize_l1_to_l2/**
      - tests/tooling/n8n-authored-editor.test.ts
      - tests/tooling/support/n8n-authored-editor.ts
      - tests/_fixtures/differential/lsp/n8n-authored-editor/**
      - tests/tooling/support/n8n-authored-registry-acceptance.ts
      - tests/_fixtures/differential/lsp/n8n-registry-authored-3952/**
      - crates/vize_maestro/**
      - crates/vize_canon/**
      - crates/vize_corsa/**
      - crates/vize/src/commands/lint*
      - crates/vize/src/commands/lint/**
      - crates/vize_carton/src/config/**
      - crates/vize_patina/**
      - npm/cli/**
      - npm/oxlint/**
  merge_group:
    types: [checks_requested]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n8n-adoption-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fixture:
    name: Pinned n8n adoption corpus
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Hydrate the read-only licensed n8n fixture
        run: git submodule update --init --depth 1 -- tests/_fixtures/_git/n8n
      - name: Verify complete fixture and frozen adoption configuration
        env:
          VIZE_N8N_FIXTURE_REQUIRED: "1"
        run: vp node --test tests/tooling/n8n-adoption-fixture.test.mjs

  compiler-custody:
    name: Complete n8n compiler source before and after
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: "1.99.0"
      VIZE_N8N_CAPTURE_BASELINE: f5699c195e627ad26aa1c8efd4a59266120cd9b9
      VIZE_N8N_REPAIR_ANCHOR: 311e3c8a0e1a42d91381ba3769ef9fcfc6c1f826
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with: { toolchain: stable }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: n8n-compiler-custody
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Hydrate the same licensed read-only originals
        run: git submodule update --init --depth 1 -- tests/_fixtures/_git/n8n
      - name: Fetch the immutable capture-only source and pinned official compiler
        run: |
          git fetch origin "$VIZE_N8N_CAPTURE_BASELINE" "$VIZE_N8N_REPAIR_ANCHOR"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/n8n-official-compiler.mjs" \
            https://unpkg.com/@vue/compiler-sfc@3.5.26/dist/compiler-sfc.esm-browser.js
          echo "4bd5cbcf9bdae4e4264be4ddb14e416074ad96909c56ba9b604e93d5b76b06ec  $RUNNER_TEMP/n8n-official-compiler.mjs" | sha256sum --check
      - name: Build and capture both authenticated source states with the same recipe
        run: |
          vp node tests/tooling/support/n8n-compiler-custody.mjs \
            "$VIZE_N8N_CAPTURE_BASELINE" \
            "$VIZE_N8N_REPAIR_ANCHOR" \
            tests/_fixtures/_git/n8n \
            "target/n8n-compiler-custody/${{ github.run_id }}-${{ github.run_attempt }}" \
            "$RUNNER_TEMP/n8n-official-compiler.mjs"
          vp node --input-type=module - "target/n8n-compiler-custody/${{ github.run_id }}-${{ github.run_attempt }}/capture.json" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const { before, after } = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          assert.equal(before.rustc, after.rustc, 'both source phases require the same actual compiler');
          assert.equal(before.cargo, after.cargo, 'both source phases require the same actual Cargo');
          assert.match(after.rustc, /^rustc 1\.99\.0 \(b940084d7 2026-09-28\)/u);
          assert.notEqual(before.binary.sha256, after.binary.sha256, 'distinct production states require distinct producers');
          NODE
      - name: Verify source SFC default-slot runtime and iterator laws
        run: cargo test --locked --profile ci -p vize_atelier_sfc --features legacy-dom-differential --test n8n_default_slot_loops -- --nocapture
      - name: Verify every n8n compiler regression and changed-source refusal
        env:
          VIZE_N8N_CONTROL_PACKET_DIR: ${{ github.workspace }}/target/n8n-compiler-custody/${{ github.run_id }}-${{ github.run_attempt }}/authored
        run: |
          cargo test --locked --profile ci --no-fail-fast -p vize_l1_to_l2 --features legacy-differential \
            --test davinci_dom_n8n_diagnosed \
            --test davinci_dom_n8n_default_loops \
            --test davinci_dom_n8n_helper_props \
            --test davinci_dom_n8n_if_key_modes -- --nocapture
      - name: Upload complete source, official modules, maps and diagnostic vectors
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: n8n-compiler-before-after-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/n8n-compiler-custody
          if-no-files-found: error

  authored-editor:
    name: Authored n8n navigation and type diagnostics
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      VIZE_TEST_REQUIRE_TSGO: "1"
      VIZE_LSP_REQUIRE_SOURCE_BUILD: "1"
      VIZE_LSP_BIN: target/ci/vize
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with: { toolchain: stable }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: n8n-authored-editor
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned source and typechecker dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Build and authenticate the current-source LSP
        run: cargo build --profile ci -p vize && vp node tests/differential/build-receipt.ts
      - name: Verify actual configuration and native fact refusal controls
        run: |
          cargo test --locked --profile ci -p vize_canon --lib --no-run
          controls_failed=0
          for filter in \
            batch::virtual_project::tsconfig_gen::compiler_options \
            batch::virtual_project::project::construction \
            batch::virtual_project::typed_router::config_tests \
            batch::virtual_project::package_source_index \
            batch::virtual_project::dependency_scan::consumed_tests \
            corsa_bridge::vue_dependencies_alias::context \
            package_route::stamp; do
            cargo test --locked --profile ci -p vize_canon --lib "$filter" -- --nocapture || controls_failed=1
          done
          test "$controls_failed" -eq 0
      - name: Check actual Canon production source with Clippy
        if: ${{ !cancelled() }}
        run: |
          rustup component add clippy
          cargo clippy --locked --profile ci -p vize_canon --lib -- -D warnings -D clippy::wildcard_imports
      - name: Preserve ordinary default-export navigation
        run: cargo test --profile ci -p vize_maestro --lib ide::definition::service::import_target::default_export::tests -- --nocapture
      - name: Check original n8n navigation and unsaved diagnostic repair
        run: vp node --test tests/tooling/n8n-authored-editor.test.ts
      - name: Build the current public CLI config export
        run: vp pack
        working-directory: npm/cli
      - name: Hydrate unchanged licensed n8n CLI inputs
        run: git submodule update --init --depth 1 -- tests/_fixtures/_git/n8n
      - name: Verify current-source CLI configuration, entries and independent witnesses
        run: |
          vp node --test tests/tooling/n8n-cli-config-contract.test.mjs tests/tooling/n8n-cli-config-failure-custody.test.mjs
          vp node tests/tooling/support/n8n-cli-config-acceptance.mjs \
            "target/n8n-cli-config/${{ github.run_id }}-${{ github.run_attempt }}"
          vp node tests/tooling/support/n8n-cli-config-semantic-acceptance.mjs \
            "target/n8n-cli-config/${{ github.run_id }}-${{ github.run_attempt }}/semantic-routing"
      - name: Verify both slot modifier options through whole source CLI and JSON-RPC packets
        run: vp node tests/tooling/support/n8n-slot-options-acceptance.ts "target/n8n-cli-config/${{ github.run_id }}-${{ github.run_attempt }}/slot-options"
      - name: Install the original pinned n8n editor workspace dependencies
        run: |
          fixture="$GITHUB_WORKSPACE/tests/_fixtures/_git/n8n"
          receipt="$GITHUB_WORKSPACE/target/n8n-cli-config/${{ github.run_id }}-${{ github.run_attempt }}/workspace-hydration"
          bootstrap="$RUNNER_TEMP/n8n-pnpm-12.4.2"
          mkdir -p "$receipt"
          git -C "$fixture" rev-parse HEAD > "$receipt/n8n-source-sha.txt"
          git -C "$fixture" diff --exit-code
          sha256sum "$fixture/package.json" "$fixture/pnpm-lock.yaml" \
            "$fixture/pnpm-workspace.yaml" \
            "$fixture/packages/frontend/editor-ui/tsconfig.json" \
            "$fixture/packages/@n8n/typescript-config/package.json" \
            > "$receipt/original-inputs.sha256"
          npm install --prefix "$bootstrap" --ignore-scripts --no-audit --no-fund pnpm@12.4.2
          sha256sum "$bootstrap/node_modules/pnpm/package.json" \
            "$bootstrap/node_modules/pnpm/bin/pnpm.mjs" \
            "$bootstrap/node_modules/@pnpm/exe.linux-x64/package.json" \
            "$bootstrap/node_modules/@pnpm/exe.linux-x64/pnpm" > "$receipt/pnpm-producer.sha256"
          (
            cd "$fixture"
            node "$bootstrap/node_modules/pnpm/bin/pnpm.mjs" --version \
              | tee "$receipt/pnpm-version.txt"
            test "$(cat "$receipt/pnpm-version.txt")" = 12.4.2
            node "$bootstrap/node_modules/pnpm/bin/pnpm.mjs" install \
              --frozen-lockfile --ignore-scripts --filter 'n8n-editor-ui...' \
              --reporter append-only
          ) 2>&1 | tee "$receipt/install.log"
          sha256sum --check "$receipt/original-inputs.sha256"
          git -C "$fixture" diff --exit-code
          vp node --input-type=module - "$fixture" "$receipt" <<'NODE'
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createRequire } from 'node:module';
          const [fixture, receipt] = process.argv.slice(2);
          const original = JSON.parse(fs.readFileSync(path.join(fixture, 'package.json'), 'utf8'));
          assert.equal(original.packageManager, 'pnpm@12.4.2');
          const require = createRequire(path.join(fixture, 'packages/frontend/editor-ui/package.json'));
          const selected = fs.realpathSync(require.resolve('@n8n/typescript-config/tsconfig.frontend.json'));
          const authored = fs.realpathSync(path.join(fixture, 'packages/@n8n/typescript-config/tsconfig.frontend.json'));
          assert.deepEqual(fs.readFileSync(selected), fs.readFileSync(authored), 'the selected config must preserve the original pinned workspace bytes');
          const installedManifest = require.resolve('@n8n/typescript-config/package.json');
          assert.deepEqual(fs.readFileSync(installedManifest), fs.readFileSync(path.join(fixture, 'packages/@n8n/typescript-config/package.json')));
          const sha256 = crypto.createHash('sha256').update(fs.readFileSync(selected)).digest('hex');
          fs.writeFileSync(path.join(receipt, 'selected-config.json'), `${JSON.stringify({ packageManager: original.packageManager, selected, authored, sha256 }, null, 2)}\n`);
          NODE
      - name: Observe the existing authored registry provider on original n8n components
        env: { VIZE_TRACE_EDITOR_PREPARATION: "1" }
        run: vp node tests/tooling/support/n8n-authored-registry-acceptance.ts "target/n8n-cli-config/${{ github.run_id }}-${{ github.run_attempt }}/authored-registry"
      - name: Upload whole CLI and independent oracle packets
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: n8n-cli-config-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/n8n-cli-config
            target/differential/lsp-sessions
          if-no-files-found: error
