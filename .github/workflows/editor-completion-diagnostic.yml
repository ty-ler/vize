name: Editor completion diagnostic
run-name: Editor completion diagnostic @ ${{ github.sha }}
on:
  push:
    branches: [diagnostic/editor-completion-a00fb6c-20261017]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  native-interleaving:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: stable
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: editor-host-smoke
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Prepare the unchanged real-host provider and fixtures
        shell: bash
        env:
          NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
          VIZE_COMPLETION_PROBE_ROOT: ${{ github.workspace }}/.completion-native-diagnostic
        run: |
          vp install --frozen-lockfile --prefer-offline
          node --input-type=module <<'NODE'
          import path from 'node:path';
          import { prepareRealVueWorkspace } from './tools/support/compat/editor-e2e/real-vue-workspace.mjs';
          for (const name of ['immediate', 'same-document', 'sibling']) {
            prepareRealVueWorkspace(path.join(process.env.VIZE_COMPLETION_PROBE_ROOT, name));
          }
          NODE
      - name: Test exact issued completion around ordered diagnostics
        shell: bash
        env:
          VIZE_COMPLETION_PROBE_ROOT: ${{ github.workspace }}/.completion-native-diagnostic
        run: |
          cargo test --locked --profile ci -p vize_maestro --lib ide::completion::resolve:: -- --include-ignored --nocapture --test-threads=1
      - name: Preserve every first-observation packet and native protocol trace
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editor-completion-observations-${{ github.sha }}
          path: |
            .completion-native-diagnostic/*/receipt.json
            .completion-native-diagnostic/*/protocol-traces/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
