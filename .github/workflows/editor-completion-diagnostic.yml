name: Editor completion diagnostic
run-name: Editor completion diagnostic @ ${{ github.sha }}
on:
  push:
    branches: [diagnostic/editor-completion-a00fb6c-20261017]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  editor-host:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/vscode-host-smoke
        env:
          VIZE_TEST_COMPLETION_EVIDENCE: ${{ runner.temp }}/vize-completion-observations/rich-completion.json
      - name: Preserve completion observations even when the host succeeds
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editor-completion-observations-${{ github.sha }}
          path: ${{ runner.temp }}/vize-completion-observations/
          if-no-files-found: warn
          retention-days: 3
