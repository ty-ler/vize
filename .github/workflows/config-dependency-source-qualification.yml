name: Config dependency source qualification
run-name: Config dependency laws at 85b7c8d4b1
on:
  push:
    branches: [ci/config-dependency-source-qualification]
permissions:
  contents: read
env:
  SOURCE_SHA: 85b7c8d4b12226b67eaf23dd7b84fb14b616c832
  CARGO_BUILD_JOBS: "12"
  CARGO_TERM_COLOR: always
  RUST_TEST_THREADS: "4"
  VIZE_TEST_REQUIRE_TSGO: "1"
jobs:
  source-laws:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/cache-vp-bootstrap
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: nextest-ci
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Retain exact source identity after mounting the Rust target cache
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p target/config-dependency-qualification
          git rev-parse HEAD HEAD^{tree} > target/config-dependency-qualification/source.txt
          git ls-files -s > target/config-dependency-qualification/source-index.txt
          sha256sum Cargo.lock crates/vize_canon/src/batch/virtual_project/tsconfig_gen/compiler_options.rs crates/vize_canon/src/batch/virtual_project/tests/editor_configuration_graph.rs crates/vize_canon/src/batch/virtual_project/tsconfig_gen/compiler_snapshot.rs crates/vize_canon/src/batch/virtual_project/tsconfig_gen/compiler_snapshot_tests.rs crates/vize_canon/src/batch/virtual_project/tsconfig_gen/compiler_inputs.rs crates/vize_canon/src/batch/virtual_project/tsconfig_paths.rs crates/vize_canon/src/package_route/search.rs crates/vize_maestro/src/server/state/config/project.rs crates/vize_canon/tests/lsp_import_resolution/compiler_snapshot.rs crates/vize_maestro/src/server/state/project_contexts/config_reload_tests.rs crates/vize/src/commands/check/runner/input_scope_tests.rs crates/vize/tests/check_tsconfig_dependency_errors_cli.rs > target/config-dependency-qualification/inputs.sha256
      - name: Run all three original and four added configuration graph laws
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize_canon --lib editor_configuration_graph_tests -- --nocapture 2>&1 | tee target/config-dependency-qualification/laws.log
          grep -F '7 passed; 0 failed; 0 ignored;' target/config-dependency-qualification/laws.log
      - name: Run all nine immutable compiler snapshot and consistency laws
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize_canon --lib compiler_snapshot::tests -- --nocapture 2>&1 | tee target/config-dependency-qualification/snapshots.log
          grep -F '9 passed; 0 failed; 0 ignored;' target/config-dependency-qualification/snapshots.log
      - name: Run the complete existing Canon tsconfig generator module laws
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize_canon --lib batch::virtual_project::tsconfig_gen:: -- --nocapture 2>&1 | tee target/config-dependency-qualification/tsconfig-generator.log
          grep -E 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' target/config-dependency-qualification/tsconfig-generator.log
      - name: Run all editor project context reload and reference ownership laws
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize_maestro --lib server::state::project_contexts:: -- --nocapture 2>&1 | tee target/config-dependency-qualification/project-contexts.log
          grep -E 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' target/config-dependency-qualification/project-contexts.log
      - name: Retain live union members and unsaved source authority
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize_canon --lib admitted_compiler_inputs_preserve_live_union_members_after_dependency_deletion -- --nocapture 2>&1 | tee target/config-dependency-qualification/union.log
          grep -F '1 passed; 0 failed; 0 ignored;' target/config-dependency-qualification/union.log
      - name: Retain lazy editor owner and admit repaired configuration
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize_maestro --lib lazy_native_owner_retains_admitted_compiler_authority_after_inherited_config_deletion -- --nocapture 2>&1 | tee target/config-dependency-qualification/lazy-owner.log
          grep -F '1 passed; 0 failed; 0 ignored;' target/config-dependency-qualification/lazy-owner.log
      - name: Require real native cold and warm hover with deleted inherited configuration
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize_canon --test lsp_import_resolution compiler_snapshot::admitted_compiler_configuration_survives_deleted_extends_before_first_native_request_and_rebuilds -- --exact --nocapture 2>&1 | tee target/config-dependency-qualification/native.log
          grep -F '1 passed; 0 failed; 0 ignored;' target/config-dependency-qualification/native.log
      - name: Run all eighteen CLI input scope unit laws
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize --lib commands::check::runner::input_scope::tests -- --nocapture 2>&1 | tee target/config-dependency-qualification/cli-unit.log
          grep -F '18 passed; 0 failed; 0 ignored;' target/config-dependency-qualification/cli-unit.log
      - name: Run all three actual CLI dependency error cases
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize --test check_tsconfig_dependency_errors_cli -- --nocapture 2>&1 | tee target/config-dependency-qualification/cli-process.log
          grep -F '3 passed; 0 failed; 0 ignored;' target/config-dependency-qualification/cli-process.log
      - name: Require normal Canon and Maestro library Clippy gates
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo clippy --locked --profile ci -p vize_canon -p vize_maestro --lib -- -D warnings -D clippy::wildcard_imports 2>&1 | tee target/config-dependency-qualification/library-clippy.log
      - name: Require the normal CLI binary Clippy gate
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo clippy --locked --profile ci -p vize --bin vize -- -D warnings -D clippy::wildcard_imports 2>&1 | tee target/config-dependency-qualification/cli-clippy.log
      - name: Require Canon all-target Clippy without warnings
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo clippy --locked --profile ci -p vize_canon --all-targets -- -D warnings -D clippy::wildcard_imports 2>&1 | tee target/config-dependency-qualification/clippy.log
      - name: Verify source custody even when a broader historical lint fails
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git diff --name-only HEAD)"
          sha256sum --check target/config-dependency-qualification/inputs.sha256
      - name: Preserve complete logs and exact source custody
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: config-dependency-source-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: target/config-dependency-qualification/
          if-no-files-found: error
          retention-days: 7
