name: Config dependency source qualification
run-name: Config dependency laws at 6341361ac5
on:
  push:
    branches: [ci/config-dependency-source-qualification]
permissions:
  contents: read
env:
  SOURCE_SHA: 6341361ac5804cc455b257b22f006bcf086924fa
  CARGO_BUILD_JOBS: "12"
  CARGO_TERM_COLOR: always
  RUST_TEST_THREADS: "4"
  VIZE_TEST_REQUIRE_TSGO: "1"
jobs:
  source-laws:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/cache-vp-bootstrap
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: nextest-ci
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Retain exact source identity after mounting the Rust target cache
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p target/config-dependency-qualification
          git rev-parse HEAD HEAD^{tree} > target/config-dependency-qualification/source.txt
          git ls-files -s > target/config-dependency-qualification/source-index.txt
          sha256sum \
            Cargo.lock \
            crates/vize_canon/src/batch/virtual_project/tsconfig_gen/compiler_options.rs \
            crates/vize_canon/src/batch/virtual_project/tests/editor_configuration_graph.rs \
            crates/vize_canon/src/batch/virtual_project/tsconfig_gen/compiler_snapshot.rs \
            crates/vize_canon/src/batch/virtual_project/tsconfig_gen/compiler_snapshot_tests.rs \
            crates/vize_canon/src/batch/virtual_project/tsconfig_gen/compiler_inputs.rs \
            crates/vize_canon/src/batch/virtual_project/tsconfig_paths.rs \
            crates/vize_canon/src/package_route/search.rs \
            crates/vize_maestro/src/server/state/config/project.rs \
            crates/vize_canon/tests/lsp_import_resolution/compiler_snapshot.rs \
            crates/vize_maestro/src/server/state/project_contexts/config_reload_tests.rs \
            crates/vize/src/commands/check/runner/input_scope_tests.rs \
            crates/vize/tests/check_tsconfig_dependency_errors_cli.rs \
            crates/vize_canon/src/batch.rs \
            crates/vize_canon/src/batch/virtual_project.rs \
            crates/vize_canon/src/batch/virtual_project/tsconfig_gen.rs \
            crates/vize_canon/src/corsa_bridge/vue_document.rs \
            crates/vize_canon/src/lib.rs \
            crates/vize_canon/src/package_route/stamp.rs \
            crates/vize_carton/src/config/loader/checked.rs \
            crates/vize_carton/src/config/loader/discovery.rs \
            crates/vize_carton/src/config/loader/js.rs \
            crates/vize_carton/src/config/loader/lsp_snapshot.rs \
            crates/vize_carton/src/config/loader/module-runtime.d.mts \
            crates/vize_carton/src/config/loader/module-runtime.mjs \
            crates/vize_carton/src/config/loader/parse.rs \
            crates/vize_maestro/src/server.rs \
            crates/vize_maestro/src/server/handlers.rs \
            crates/vize_maestro/src/server/helpers.rs \
            crates/vize_maestro/src/server/project_contexts.rs \
            crates/vize_maestro/src/server/project_contexts/operation_admission_tests.rs \
            crates/vize_maestro/src/server/state/config.rs \
            crates/vize_maestro/src/server/state/corsa.rs \
            crates/vize_maestro/src/server/state/project_contexts.rs \
            crates/vize_maestro/src/server/state/project_contexts/config_reload.rs \
            crates/vize_maestro/src/server/state/project_contexts/freshness.rs \
            crates/vize_maestro/src/server/state/project_contexts/freshness_tests.rs \
            crates/vize_maestro/src/server/state/project_contexts/references.rs \
            crates/vize_maestro/src/server/state/project_contexts/registry.rs \
            crates/vize_maestro/src/server/state/project_contexts/topology.rs \
            crates/vize_maestro/src/server/state/project_contexts/topology_tests.rs \
            crates/vize_maestro/src/server/state/project_contexts/watched.rs \
            crates/vize_maestro/src/server/workspace_files.rs \
            crates/vize_maestro/src/server/workspace_files/config_watchers.rs \
            crates/vize_maestro/src/server/workspace_files/config_watchers_tests.rs \
            crates/vize_maestro/src/server/workspace_files/watched.rs \
            crates/vize_maestro/src/server/workspace_folder_events.rs \
            docs/content/guide/vue-configuration.md \
            docs/content/ja/guide/vue-configuration.md \
            editors/vscode/test/fixtures/passive-vize-server.cjs \
            editors/vscode/test/run-existing-config-host-real.mjs \
            editors/vscode/test/suite/existing-config-real.cjs \
            editors/vscode/test/suite/external-config-real.cjs \
            tests/tooling/lsp-config-bundle-repair.test.ts \
            tests/tooling/native-config-repair-observations.test.ts \
            tests/tooling/vscode-passive-server-proxy.test.ts \
            crates/vize/tests/lsp_workspace_package_projection_cli.rs \
            crates/vize_carton/src/config.rs \
            crates/vize_carton/src/config/loader.rs \
            crates/vize_carton/src/config/loader/js_observation.rs \
            crates/vize_maestro/src/server/state/config/host.rs \
            crates/vize_maestro/src/server/state/project_contexts/lock_order_tests.rs \
            crates/vize_maestro/src/server/state/workspace_folders/tests.rs \
            crates/vize_maestro/src/server/workspace_files/config_watchers_protocol_tests.rs \
            davinci/vize_l0/src/config/document.rs \
            tests/tooling/config-host-boundary.test.ts \
            tests/tooling/native-config-preload-observations.test.ts \
            tests/tooling/native-config-module-loader.test.ts \
            tests/tooling/support/davinci-host-imports.ts \
            > target/config-dependency-qualification/inputs.sha256
      - name: Check config host boundaries and actual loader repair observation laws
        run: |
          set -euo pipefail
          node --test --test-reporter=tap tests/tooling/config-host-boundary.test.ts tests/tooling/native-config-repair-observations.test.ts tests/tooling/native-config-preload-observations.test.ts tests/tooling/native-config-module-loader.test.ts tests/tooling/vscode-passive-server-proxy.test.ts 2>&1 | tee target/config-dependency-qualification/loader-observations.log
          grep -E '# pass [1-9][0-9]*' target/config-dependency-qualification/loader-observations.log
      - name: Run all five native Carton observation transport laws
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize_carton --lib config::loader::js_observation::tests:: -- --nocapture 2>&1 | tee target/config-dependency-qualification/carton-transport.log
          grep -F '5 passed; 0 failed; 0 ignored;' target/config-dependency-qualification/carton-transport.log
      - name: Run all four actual editor snapshot preload and exit laws
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize_carton --lib config::loader::lsp_snapshot::tests:: -- --nocapture 2>&1 | tee target/config-dependency-qualification/carton-snapshots.log
          grep -F '4 passed; 0 failed; 0 ignored;' target/config-dependency-qualification/carton-snapshots.log
      - name: Run all three original and four added configuration graph laws
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize_canon --lib editor_configuration_graph_tests -- --nocapture 2>&1 | tee target/config-dependency-qualification/laws.log
          grep -F '7 passed; 0 failed; 0 ignored;' target/config-dependency-qualification/laws.log
      - name: Run all twelve immutable compiler snapshot and attempt laws
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize_canon --lib compiler_snapshot::tests -- --nocapture 2>&1 | tee target/config-dependency-qualification/snapshots.log
          grep -F '12 passed; 0 failed; 0 ignored;' target/config-dependency-qualification/snapshots.log
      - name: Run the complete existing Canon tsconfig generator module laws
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize_canon --lib batch::virtual_project::tsconfig_gen:: -- --nocapture 2>&1 | tee target/config-dependency-qualification/tsconfig-generator.log
          grep -E 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' target/config-dependency-qualification/tsconfig-generator.log
      - name: Run all editor project context reload and reference ownership laws
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize_maestro --lib server::state::project_contexts:: -- --nocapture 2>&1 | tee target/config-dependency-qualification/project-contexts.log
          grep -E 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' target/config-dependency-qualification/project-contexts.log
      - name: Retain every workspace folder policy after invalid primary admission
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize_maestro --lib server::state::workspace_folders::tests:: -- --nocapture 2>&1 | tee target/config-dependency-qualification/workspace-folders.log
          grep -F '7 passed; 0 failed; 0 ignored;' target/config-dependency-qualification/workspace-folders.log
      - name: Retain live union members and unsaved source authority
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize_canon --lib admitted_compiler_inputs_preserve_live_union_members_after_dependency_deletion -- --nocapture 2>&1 | tee target/config-dependency-qualification/union.log
          grep -F '1 passed; 0 failed; 0 ignored;' target/config-dependency-qualification/union.log
      - name: Retain lazy editor owner and admit repaired configuration
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize_maestro --lib lazy_native_owner_retains_admitted_compiler_authority_after_inherited_config_deletion -- --nocapture 2>&1 | tee target/config-dependency-qualification/lazy-owner.log
          grep -F '1 passed; 0 failed; 0 ignored;' target/config-dependency-qualification/lazy-owner.log
      - name: Require native cold and warm hover and retired union membership
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize_canon --test lsp_import_resolution compiler_snapshot:: -- --nocapture 2>&1 | tee target/config-dependency-qualification/native.log
          grep -F '2 passed; 0 failed; 0 ignored;' target/config-dependency-qualification/native.log
      - name: Exercise actual didChange fanout with one admission per governing root
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize_maestro --lib server::project_contexts::operation_admission_tests:: -- --nocapture 2>&1 | tee target/config-dependency-qualification/operation-admission.log
          grep -F '2 passed; 0 failed; 0 ignored;' target/config-dependency-qualification/operation-admission.log
      - name: Exercise native dynamic watcher lifecycle and held ACK responsiveness
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize_maestro --lib server::workspace_files::config_watchers::tests:: -- --nocapture 2>&1 | tee target/config-dependency-qualification/config-watchers.log
          grep -F '8 passed; 0 failed; 0 ignored;' target/config-dependency-qualification/config-watchers.log
      - name: Require the original workspace package native freshness regression unchanged
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize --test lsp_workspace_package_projection_cli shared_workspace_package_native_queries_and_freshness_share_one_server -- --exact --nocapture 2>&1 | tee target/config-dependency-qualification/workspace-native.log
          grep -F '1 passed; 0 failed; 0 ignored;' target/config-dependency-qualification/workspace-native.log
      - name: Exercise real Vite partial graph repair through the source-built CLI
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo build --profile ci -p vize 2>&1 | tee target/config-dependency-qualification/source-cli-build.log
          node tests/differential/build-receipt.ts
          cp target/ci/vize.differential-build.json target/config-dependency-qualification/
          VIZE_LSP_BIN=target/ci/vize VIZE_LSP_REQUIRE_SOURCE_BUILD=1 node --test --test-reporter=tap tests/tooling/lsp-config-bundle-repair.test.ts 2>&1 | tee target/config-dependency-qualification/vite-bundle-repair.log
          grep -F '# pass 1' target/config-dependency-qualification/vite-bundle-repair.log
      - name: Run all eighteen CLI input scope unit laws
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize --lib commands::check::runner::input_scope::tests -- --nocapture 2>&1 | tee target/config-dependency-qualification/cli-unit.log
          grep -F '18 passed; 0 failed; 0 ignored;' target/config-dependency-qualification/cli-unit.log
      - name: Run all three actual CLI dependency error cases
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize --test check_tsconfig_dependency_errors_cli -- --nocapture 2>&1 | tee target/config-dependency-qualification/cli-process.log
          grep -F '3 passed; 0 failed; 0 ignored;' target/config-dependency-qualification/cli-process.log
      - name: Require normal Carton, Canon and Maestro library Clippy gates
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo clippy --locked --profile ci -p vize_carton -p vize_canon -p vize_maestro --lib -- -D warnings -D clippy::wildcard_imports 2>&1 | tee target/config-dependency-qualification/library-clippy.log
      - name: Require the normal CLI binary Clippy gate
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo clippy --locked --profile ci -p vize --bin vize -- -D warnings -D clippy::wildcard_imports 2>&1 | tee target/config-dependency-qualification/cli-clippy.log
      - name: Require Canon all-target Clippy without warnings
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo clippy --locked --profile ci -p vize_canon --all-targets -- -D warnings -D clippy::wildcard_imports 2>&1 | tee target/config-dependency-qualification/clippy.log
      - name: Verify source custody even when a broader historical lint fails
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git diff --name-only HEAD)"
          sha256sum --check target/config-dependency-qualification/inputs.sha256
      - name: Preserve complete logs and exact source custody
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: config-dependency-source-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: |
            target/config-dependency-qualification/
            target/differential/config-bundle-repair/
          if-no-files-found: error
          retention-days: 7
