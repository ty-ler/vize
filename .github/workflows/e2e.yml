name: App E2E
on:
  workflow_dispatch:
run-name: VueFes original H scope diagnostic @ ${{ github.sha }}
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
  E2E_TARGET_SHA: 605429c660b328bb03bec5bbfef15961e59fcaf0
jobs:
  original-vuefes-scope:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - name: Checkout literal original release source H
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: 605429c660b328bb03bec5bbfef15961e59fcaf0
          persist-credentials: false
      - name: Checkout independent supplementary observer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          path: .vuefes-observer
          persist-credentials: false
      - name: Authenticate whole production sources and install supplementary observer
        run: python3 .vuefes-observer/tools/support/ci/install-vuefes-scope-observer.py
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      - uses: ./.github/actions/setup-rust-script
      - name: Original full VueFes row plan
        id: plan
        run: |
          set -euo pipefail
          for field in task timeout needs-playwright cache-key worktree-id artifact-stem; do
            value=$(rust-script tools/commands/ci/github/app-e2e-plan.rs --profile full --suite vrt --shard vuefes --field "$field")
            echo "$field=$value" >> "$GITHUB_OUTPUT"
          done
          rust-script tools/commands/ci/github/app-e2e-plan.rs --profile full --suite vrt --field evidence > target/app-e2e-logs/vuefes-scope/original-vrt-plan.json
      - name: Original unrelaxed full VueFes VRT row
        uses: ./.github/actions/app-e2e-row
        with:
          profile: full
          suite: vrt
          shard: vuefes
          task: ${{ steps.plan.outputs.task }}
          timeout: ${{ steps.plan.outputs.timeout }}
          needs-playwright: ${{ steps.plan.outputs.needs-playwright }}
          cache-key: ${{ steps.plan.outputs.cache-key }}
          worktree-id: ${{ steps.plan.outputs.worktree-id }}
          artifact-stem: ${{ steps.plan.outputs.artifact-stem }}
      - name: Capture actual native producer identity and pinned original SFCs
        if: always()
        run: |
          set -euo pipefail
          python3 .vuefes-observer/tools/support/ci/capture-vuefes-producer.py
      - name: Preserve original strict post-build source diff gate
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 605429c660b328bb03bec5bbfef15961e59fcaf0
          test "$(git -C tests/_fixtures/_git/vuefes-2025 rev-parse HEAD)" = 8eff3cd7dd79a7f47bbf2b78202b9aa2070ec5a6
          git diff --exit-code -- crates davinci npm Cargo.toml Cargo.lock package.json pnpm-lock.yaml pnpm-workspace.yaml
      - name: Verify supplementary observer completeness separately
        if: always()
        run: |
          python3 - <<'PYINNER'
          import json, pathlib
          receipt = pathlib.Path("target/app-e2e-logs/vuefes-scope/observer-completeness.json")
          assert receipt.exists(), "missing supplementary observer completeness receipt"
          assert json.loads(receipt.read_text())["complete"], "supplementary observer incomplete; original VRT verdict retained separately"
          PYINNER
      - name: Retain complete original screenshots and supplementary receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vuefes-original-H-scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/app-e2e-logs/
            tests/app/results/
            tests/app/playwright-report/
            tests/playwright-report/
            .vize/artifacts/
          if-no-files-found: error
          retention-days: 7
